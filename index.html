<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Книга Рецептів</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { padding: 10px; background: #f4f4f9; color: #333; -webkit-tap-highlight-color: transparent; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .social-container { display: flex; gap: 10px; }
    .social-btn { color: #40E0D0; display: inline-flex; text-decoration: none; padding: 4px; }

    .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    input, select, button, textarea { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #40E0D0; }
    
    button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    button:active { opacity: 0.85; }
    button.btn-secondary { background: #007bff; }
    button.btn-excel { background: #1d6f42; }
    
    button.btn-edit { background: #40E0D0; color: #fff; padding: 6px 12px; width: 100%; min-height: 36px; border-radius: 6px; font-size: 13px; }
    button.btn-danger { background: #dc3545; color: #fff; }
    button.btn-icon-danger { background: #fff0f0; color: #dc3545; border: 1px solid #ffcdd2; width: 36px; height: 36px; min-height: 36px; border-radius: 50%; padding: 0; font-size: 16px; cursor: pointer; }
    button.btn-icon-danger:active { background: #ffe0e0; }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-group button { flex: 1; min-width: 90px; font-size: 12px; min-height: 36px; padding: 6px; }
    
    /* Сітка та картки */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #edf2f7; }
    
    .card-preview { 
      width: 100%; 
      height: 190px; 
      object-fit: cover; 
      object-position: top left; 
      background: #e9ecef; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 32px; 
      color: #6c757d; 
      cursor: pointer; 
    }
    
    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    
    /* Збільшена та виразніша назва рецепту */
    .card h3 { font-size: 18px; font-weight: 700; color: #1a202c; line-height: 1.3; }
    
    .badge { display: inline-block; background: #edf2f7; color: #4a5568; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; margin-right: 4px; margin-bottom: 4px; }
    .media-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; }
    .media-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    
    /* Адаптивний блок тексту рецепту */
    .text-content { 
      flex-grow: 1; 
      min-height: 40px; 
      max-height: 250px; 
      overflow-y: auto; 
      white-space: pre-wrap; 
      background: #f8fafc; 
      padding: 8px; 
      border-radius: 6px; 
      font-size: 13px; 
      line-height: 1.4;
      border: 1px solid #e2e8f0; 
      -webkit-overflow-scrolling: touch;
    }
    .notes-content { 
      font-size: 12px; 
      color: #744210; 
      background: #fffbea; 
      padding: 8px; 
      border-radius: 6px; 
      border: 1px dashed #fbd38d; 
      max-height: 100px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Форма додавання */
    .form-group { background: white; padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }

    .social-link { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 12px; width: 100%; }
    .social-link.fb { background: #e7f3ff; color: #1877f2; }
    .social-link.insta { background: #fdf0f5; color: #e4405f; }
    .social-link.tiktok { background: #f1f1f1; color: #000; }
    .social-link.yt { background: #ffe6e6; color: #ff0000; }
    .social-link.image-btn { background: #e6f9f7; color: #008b8b; }

    /* Зона завантаження */
    .drop-zone {
      border: 1px dashed #007bff;
      border-radius: 8px;
      padding: 10px;
      background: #f0f7ff;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      color: #0056b3;
    }
    .drop-zone:active { background: #e1f0ff; }
    .preview-thumbnail { max-height: 90px; max-width: 100%; margin-top: 6px; border-radius: 6px; display: none; object-fit: contain; }

    /* Модальні вікна */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 12px; backdrop-filter: blur(2px); }
    .modal-content { background: white; padding: 16px; border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; position: relative; }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .modal-header h3 { font-size: 17px; color: #1a202c; }

    .image-viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; z-index: 2000; padding: 5px; }
    .image-viewer-modal img { max-width: 100%; max-height: 95vh; object-fit: contain; }
    .close-viewer { position: absolute; top: 12px; right: 18px; color: white; font-size: 32px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h2 style="font-size: 20px;">📖 Книга Рецептів</h2>
  <div class="social-container">
    <a href="https://facebook.com" target="_blank" class="social-btn" aria-label="Facebook">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
    </a>
    <a href="https://instagram.com" target="_blank" class="social-btn" aria-label="Instagram">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path></svg>
    </a>
  </div>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Пошук..." oninput="render()">
  <select id="categoryFilter" onchange="render()">
    <option value="">Усі категорії</option>
  </select>
  <div class="btn-group">
    <button class="btn-secondary" onclick="exportData()">💾 JSON</button>
    <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📂 JSON</button>
    <button class="btn-excel" onclick="document.getElementById('excelInput').click()">📊 Excel</button>
    
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importData(event)">
    <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="importExcelData(event)">
  </div>
</div>

<!-- Форма додавання -->
<details class="form-group" id="addDetails">
  <summary style="cursor: pointer; font-weight: bold; font-size: 14px; padding: 4px 0;">➕ Додати рецепт / скріншот</summary>
  <form id="recipeForm" onsubmit="addRecipe(event)" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
    <input type="text" id="title" placeholder="Назва рецепту *" required>
    
    <div style="display: flex; gap: 6px;">
      <input type="text" id="category" placeholder="Категорія" style="flex:1;">
      <select id="type" style="flex:1;">
        <option value="image">📱 Скріншот / Фото</option>
        <option value="text">📝 Текст</option>
        <option value="youtube">YouTube</option>
        <option value="tiktok">TikTok</option>
        <option value="facebook">Facebook</option>
        <option value="instagram">Instagram</option>
      </select>
    </div>

    <!-- Зона вставки з буфера / файлу -->
    <div class="drop-zone" onclick="document.getElementById('imageFile').click()">
      📋 <b>Вставити фото / скріншот</b>
      <input type="file" id="imageFile" accept="image/*" style="display:none" onchange="handleImageUpload(event, 'add')">
      <img id="addPreviewThumb" class="preview-thumbnail" alt="Прев'ю">
    </div>

    <input type="url" id="image" placeholder="або URL картинки (https://...)" style="font-size: 12px;">
    <input type="url" id="link" placeholder="🔗 Джерело / Посилання">
    <textarea id="content" placeholder="📝 Текст рецепту / інгредієнти" rows="3"></textarea>
    <textarea id="description" placeholder="📌 Нотатки / Примітки" rows="2"></textarea>
    <input type="text" id="tags" placeholder="Теги через кому (напр. салат, швидкий)">
    <button type="submit" style="margin-top: 4px;">Зберегти</button>
  </form>
</details>

<div id="recipesGrid" class="grid"></div>

<!-- Модальне вікно редагування -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>✏️ Редагувати рецепт</h3>
      <!-- Кнопка видалення у правому верхньому кутку редагування -->
      <button type="button" class="btn-icon-danger" title="Видалити рецепт" onclick="deleteCurrentRecipe()">🗑️</button>
    </div>
    
    <form id="editForm" onsubmit="saveEdit(event)" style="display: flex; flex-direction: column; gap: 8px;">
      <input type="hidden" id="editId">
      <input type="text" id="editTitle" placeholder="Назва рецепту *" required>
      
      <div style="display: flex; gap: 6px;">
        <input type="text" id="editCategory" placeholder="Категорія" style="flex:1;">
        <select id="editType" style="flex:1;">
          <option value="image">📱 Скріншот / Фото</option>
          <option value="text">📝 Текст</option>
          <option value="youtube">YouTube</option>
          <option value="tiktok">TikTok</option>
          <option value="facebook">Facebook</option>
          <option value="instagram">Instagram</option>
        </select>
      </div>
      
      <div class="drop-zone" onclick="document.getElementById('editImageFile').click()">
        📋 <b>Замінити фото / скріншот</b>
        <input type="file" id="editImageFile" accept="image/*" style="display:none" onchange="handleImageUpload(event, 'edit')">
        <img id="editPreviewThumb" class="preview-thumbnail" alt="Прев'ю">
      </div>

      <div style="display: flex; gap: 6px; align-items: center;">
        <input type="url" id="editImage" placeholder="URL картинки" style="font-size: 12px; flex:1;">
        <button type="button" style="background:#e2e8f0; color:#4a5568; font-size:12px; width:auto; padding:0 10px; min-height:38px; border-radius:8px;" onclick="removeImage()">🗑️ Очистити</button>
      </div>

      <input type="url" id="editLink" placeholder="🔗 Посилання (URL)">
      <textarea id="editContent" placeholder="📝 Текст рецепту" rows="3"></textarea>
      <textarea id="editDescription" placeholder="📌 Нотатки / Примітки" rows="2"></textarea>
      <input type="text" id="editTags" placeholder="Теги через кому">
      
      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button type="submit" style="flex: 1;">Зберегти</button>
        <button type="button" class="btn-danger" style="flex: 1;" onclick="closeEditModal()">Скасувати</button>
      </div>
    </form>
  </div>
</div>

<!-- Повноекранний перегляд скріншота -->
<div id="imageViewer" class="image-viewer-modal" onclick="closeImageViewer()">
  <span class="close-viewer">&times;</span>
  <img id="fullImage" src="" alt="Скріншот рецепта">
</div>

<script>
  let recipes = JSON.parse(localStorage.getItem('my_recipes')) || [];
  let tempAddBase64 = "";
  let tempEditBase64 = "";
  let isImageRemoved = false;

  function generateCustomId() {
    const now = new Date();
    const datePrefix = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
    const todayRecipes = recipes.filter(r => r.id && r.id.toString().startsWith(datePrefix));
    return `${datePrefix}${String(todayRecipes.length + 1).padStart(4, '0')}`;
  }

  function saveToStorage() {
    localStorage.setItem('my_recipes', JSON.stringify(recipes));
    updateCategories();
    render();
  }

  // Обробка вставки з буфера обміну
  document.addEventListener('paste', function (e) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let item of items) {
      if (item.type.indexOf('image') !== -1) {
        const file = item.getAsFile();
        const mode = document.getElementById('editModal').style.display === 'flex' ? 'edit' : 'add';
        
        if (mode === 'add') {
          document.getElementById('addDetails').open = true;
        }

        processImageFile(file, mode);
        break;
      }
    }
  });

  function handleImageUpload(event, mode) {
    const file = event.target.files[0];
    if (file) processImageFile(file, mode);
  }

  function processImageFile(file, mode) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1200;
        const scaleSize = MAX_WIDTH / img.width;
        
        if (img.width > MAX_WIDTH) {
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
        } else {
          canvas.width = img.width;
          canvas.height = img.height;
        }

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);

        if (mode === 'add') {
          tempAddBase64 = compressedBase64;
          const thumb = document.getElementById('addPreviewThumb');
          thumb.src = compressedBase64;
          thumb.style.display = 'block';
        } else {
          tempEditBase64 = compressedBase64;
          isImageRemoved = false;
          const thumb = document.getElementById('editPreviewThumb');
          thumb.src = compressedBase64;
          thumb.style.display = 'block';
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removeImage() {
    tempEditBase64 = "";
    document.getElementById('editImage').value = "";
    document.getElementById('editImageFile').value = "";
    document.getElementById('editPreviewThumb').style.display = "none";
    isImageRemoved = true;
  }

  function openImageViewer(imgSrc) {
    document.getElementById('fullImage').src = imgSrc;
    document.getElementById('imageViewer').style.display = 'flex';
  }

  function closeImageViewer() {
    document.getElementById('imageViewer').style.display = 'none';
  }

  function addRecipe(e) {
    e.preventDefault();
    const urlImage = document.getElementById('image').value.trim();
    const finalImage = tempAddBase64 || urlImage;
    
    const newRecipe = {
      id: generateCustomId(),
      title: document.getElementById('title').value,
      category: document.getElementById('category').value.trim() || 'Загальні',
      tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t),
      type: document.getElementById('type').value,
      image: finalImage,
      link: document.getElementById('link').value.trim(),
      content: document.getElementById('content').value,
      description: document.getElementById('description').value
    };
    
    recipes.push(newRecipe);
    saveToStorage();
    
    document.getElementById('recipeForm').reset();
    document.getElementById('addPreviewThumb').style.display = 'none';
    tempAddBase64 = "";
  }

  function openEditModal(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;

    tempEditBase64 = "";
    isImageRemoved = false;
    
    document.getElementById('editId').value = recipe.id;
    document.getElementById('editTitle').value = recipe.title;
    document.getElementById('editCategory').value = recipe.category;
    document.getElementById('editTags').value = recipe.tags ? recipe.tags.join(', ') : '';
    document.getElementById('editType').value = recipe.type || 'image';
    document.getElementById('editImage').value = recipe.image && !recipe.image.startsWith('data:') ? recipe.image : '';
    document.getElementById('editLink').value = recipe.link || '';
    document.getElementById('editContent').value = recipe.content || '';
    document.getElementById('editDescription').value = recipe.description || '';

    const editThumb = document.getElementById('editPreviewThumb');
    if (recipe.image) {
      editThumb.src = recipe.image;
      editThumb.style.display = 'block';
    } else {
      editThumb.style.display = 'none';
    }

    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    tempEditBase64 = "";
    isImageRemoved = false;
  }

  function saveEdit(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const recipeIndex = recipes.findIndex(r => r.id === id);

    if (recipeIndex !== -1) {
      const urlImage = document.getElementById('editImage').value.trim();
      let finalImage = "";
      
      if (!isImageRemoved) {
        finalImage = tempEditBase64 || urlImage || recipes[recipeIndex].image || "";
      }

      recipes[recipeIndex] = {
        id: id,
        title: document.getElementById('editTitle').value,
        category: document.getElementById('editCategory').value.trim() || 'Загальні',
        tags: document.getElementById('editTags').value ? document.getElementById('editTags').value.split(',').map(t => t.trim()).filter(t => t) : [],
        type: document.getElementById('editType').value,
        image: finalImage,
        link: document.getElementById('link').value.trim(),
        content: document.getElementById('editContent').value,
        description: document.getElementById('editDescription').value
      };
      saveToStorage();
      closeEditModal();
    }
  }

  /* Видалення з підтвердженням з форми редагування */
  function deleteCurrentRecipe() {
    const id = document.getElementById('editId').value;
    const recipe = recipes.find(r => r.id === id);
    const title = recipe ? `"${recipe.title}"` : 'цей рецепт';

    if (confirm(`Ви дійсно бажаєте видалити ${title}? Цю дію неможливо скасувати.`)) {
      recipes = recipes.filter(r => r.id !== id);
      saveToStorage();
      closeEditModal();
    }
  }

  function updateCategories() {
    const categories = [...new Set(recipes.map(r => r.category))];
    const select = document.getElementById('categoryFilter');
    const currentValue = select.value;
    select.innerHTML = '<option value="">Усі категорії</option>' + 
      categories.map(c => `<option value="${c}">${c}</option>`).join('');
    select.value = currentValue;
  }

  function getYouTubeId(url) {
    if (!url) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  function getPreviewImage(recipe) {
    if (recipe.image) return recipe.image;
    if (recipe.type === 'youtube' && recipe.link) {
      const ytId = getYouTubeId(recipe.link);
      if (ytId) return `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
    }
    return null;
  }

  function getPlaceholderSVG(type) {
    if (type === 'facebook') return `📘`;
    if (type === 'instagram') return `📷`;
    if (type === 'tiktok') return '🎵';
    if (type === 'image') return '📱';
    return '🍳';
  }

  function render() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const grid = document.getElementById('recipesGrid');
    grid.innerHTML = '';

    const filtered = recipes.filter(r => {
      const matchesCategory = !category || r.category === category;
      const matchesSearch = r.title.toLowerCase().includes(search) || 
                            (r.content && r.content.toLowerCase().includes(search)) ||
                            (r.description && r.description.toLowerCase().includes(search)) ||
                            (r.tags && r.tags.some(t => t.toLowerCase().includes(search)));
      return matchesCategory && matchesSearch;
    });

    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      
      const imgUrl = getPreviewImage(r);
      
      let previewHtml = imgUrl 
        ? `<img src="${imgUrl}" class="card-preview" alt="${r.title}" loading="lazy" onclick="openImageViewer('${imgUrl}')">`
        : `<div class="card-preview">${getPlaceholderSVG(r.type)}</div>`;

      let mediaHtml = '';
      if (imgUrl) {
        mediaHtml += `<button class="social-link image-btn" onclick="openImageViewer('${imgUrl}')">🔍 Відкрити фото</button>`;
      }

      if (r.link) {
        if (r.type === 'youtube') {
          const ytId = getYouTubeId(r.link);
          mediaHtml += ytId ? `<div class="media-container" style="margin-top:4px;"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>` 
                            : `<a href="${r.link}" target="_blank" class="social-link yt">▶️ YouTube</a>`;
        } else if (r.type === 'tiktok') {
          mediaHtml += `<a href="${r.link}" target="_blank" class="social-link tiktok">🎵 TikTok</a>`;
        } else if (r.type === 'facebook') {
          mediaHtml += `<a href="${r.link}" target="_blank" class="social-link fb">📘 Facebook</a>`;
        } else if (r.type === 'instagram') {
          mediaHtml += `<a href="${r.link}" target="_blank" class="social-link insta">📷 Instagram</a>`;
        } else {
          mediaHtml += `<a href="${r.link}" target="_blank" class="social-link">🌐 Перейти</a>`;
        }
      }

      let contentHtml = r.content ? `<div class="text-content">${r.content}</div>` : '';
      let notesHtml = r.description ? `<div class="notes-content">📎 ${r.description}</div>` : '';

      card.innerHTML = `
        ${previewHtml}
        <div class="card-body">
          <h3>${r.title}</h3>
          <div><span class="badge">${r.category}</span></div>
          ${mediaHtml}
          ${contentHtml}
          ${notesHtml}
          <div>${r.tags ? r.tags.map(t => `<span class="badge">#${t}</span>`).join(' ') : ''}</div>
          <div class="card-actions">
            <button class="btn-edit" onclick="openEditModal('${r.id}')">✏️ Редагувати</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `recipes_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        let imported = JSON.parse(evt.target.result);
        if (!Array.isArray(imported)) {
          if (typeof imported === 'object' && imported !== null) imported = [imported];
          else return;
        }

        let count = 0;
        imported.forEach(item => {
          const title = item.title || item.name || item.Title || '';
          if (title) {
            recipes.push({
              id: generateCustomId(),
              title: title.toString().trim(),
              category: (item.category || item.Category || 'Загальні').toString().trim(),
              tags: Array.isArray(item.tags) ? item.tags : (item.tags ? item.tags.toString().split(',').map(t => t.trim()).filter(t => t) : []),
              type: item.type || 'image',
              image: (item.image || item.img || '').toString().trim(),
              link: (item.link || item.url || '').toString().trim(),
              content: (item.content || item.text || '').toString().trim(),
              description: (item.description || item.notes || '').toString().trim()
            });
            count++;
          }
        });

        if (count > 0) { saveToStorage(); alert(`Додано ${count} рецептів!`); }
      } catch (err) { alert('Помилка імпорту.'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  function importExcelData(e) {
    const file = e.target.files[0];
    if (!file || typeof XLSX === 'undefined') return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const excelRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        let count = 0;
        excelRows.forEach(row => {
          const getVal = (keys) => {
            for (let key of keys) {
              const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === key.toLowerCase());
              if (foundKey && row[foundKey] !== undefined) return row[foundKey];
            }
            return '';
          };

          const title = getVal(['title', 'назва', 'рецепт']);
          if (title) {
            recipes.push({
              id: generateCustomId(),
              title: title.toString().trim(),
              category: getVal(['category', 'категорія']) || 'Загальні',
              tags: getVal(['tags', 'теги']) ? getVal(['tags', 'теги']).toString().split(',').map(t => t.trim()).filter(t => t) : [],
              type: getVal(['type', 'тип']).toString().toLowerCase() || 'image',
              image: getVal(['image', 'фото']).toString().trim(),
              link: getVal(['link', 'посилання']).toString().trim(),
              content: getVal(['content', 'текст']).toString().trim(),
              description: getVal(['description', 'нотатки', 'опис']).toString().trim()
            });
            count++;
          }
        });

        if (count > 0) { saveToStorage(); alert(`Імпортовано ${count} рецептів!`); }
      } catch (err) { alert('Помилка імпорту.'); }
      e.target.value = '';
    };
    reader.readAsArrayBuffer(file);
  }

  updateCategories();
  render();
</script>
</body>
</html>
