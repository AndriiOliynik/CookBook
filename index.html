<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Книга Рецептів</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      padding: 12px; 
      padding-top: calc(36px + env(safe-area-inset-top)); 
      padding-bottom: 110px; 
      background: #f4f4f9; 
      color: #333; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 14px; 
      position: relative; 
      padding-top: 6px;
    }
    header h2 { font-size: 20px; font-weight: 800; }

    .menu-toggle-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 22px;
      cursor: pointer;
      padding: 6px 12px;
      color: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      border-radius: 10px;
      padding: 8px;
      z-index: 1000;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      border: 1px solid #e2e8f0;
    }
    .dropdown-menu.show { display: flex; }
    .dropdown-menu button {
      font-size: 13px;
      min-height: 38px;
      padding: 6px 12px;
      text-align: left;
      border-radius: 6px;
    }

    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    input, select, button, textarea { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #40E0D0; }
    
    button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    button:active { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.btn-secondary { background: #007bff; color: white; }
    button.btn-excel { background: #1d6f42; }
    button.btn-danger { background: #dc3545; color: #fff; }
    button.btn-icon-danger { background: #fff0f0; color: #dc3545; border: 1px solid #ffcdd2; width: 36px; height: 36px; border-radius: 50%; padding: 0; font-size: 16px; }

    .grid-control-box { display: flex; align-items: center; gap: 8px; background: #fff; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; }
    .grid-control-box select { width: auto; flex-grow: 1; padding: 4px 8px; font-size: 13px; }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(var(--cols-count, 2), minmax(0, 1fr)); 
      gap: 12px; 
    }
    
    .card { 
      background: white; 
      border-radius: 12px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      border: 1px solid #edf2f7; 
      width: 100%; 
      position: relative;
    }

    .card-header-box { 
      padding: var(--card-padding, 6px 8px); 
      display: flex; 
      flex-direction: column; 
      gap: 2px; 
      z-index: 2;
    }
    .card h3 { 
      font-size: var(--card-title-size, 13px); 
      font-weight: 700; 
      color: #1a202c; 
      line-height: 1.2; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    .slider-container {
      position: relative;
      width: 100%;
      height: var(--img-height, 140px);
      background: #e9ecef;
      overflow: hidden;
      flex-shrink: 0;
    }
    .slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .slider-track::-webkit-scrollbar { display: none; }
    .slider-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      object-fit: cover;
      cursor: pointer;
    }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.35);
      color: white;
      border: none;
      width: var(--btn-slider-size, 22px);
      height: var(--btn-slider-size, 22px);
      border-radius: 50%;
      min-height: auto;
      font-size: var(--btn-slider-font, 12px);
      z-index: 5;
      padding: 0;
    }
    .slider-btn.prev { left: 4px; }
    .slider-btn.next { right: 4px; }
    .no-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #a0aec0; }

    .card-footer-box { 
      padding: var(--card-padding, 6px 8px); 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      margin-top: auto; 
      background: #fff;
      z-index: 2;
    }

    .card-buttons-row {
      display: flex;
      gap: 4px;
      width: 100%;
      align-items: center;
    }

    .btn-icon-only {
      font-size: var(--btn-icon-size, 13px);
      height: var(--btn-height, 30px);
      min-height: var(--btn-height, 30px);
      padding: 0;
      border-radius: 6px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon-desc { background: #edf2f7; color: #2d3748; border: 1px solid #cbd5e0; }
    .btn-icon-notes { background: #fffbea; color: #744210; border: 1px solid #fbd38d; }
    .btn-icon-edit { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
    
    .btn-icon-only:disabled {
      background: #f1f5f9 !important;
      color: #cbd5e1 !important;
      border-color: #e2e8f0 !important;
    }

    .social-link { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 600; 
      text-decoration: none; 
      padding: 3px; 
      border-radius: 6px; 
      font-size: var(--link-font-size, 10px); 
      width: 100%; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .social-link.url-default { background: #e7f3ff; color: #0066cc; }
    .social-link.url-youtube { background: #ffe6e6; color: #cc0000; }
    .social-link.url-instagram { background: #fdf0f5; color: #c13584; }
    .social-link.url-tiktok { background: #e6f7f7; color: #000000; }
    .social-link.url-facebook { background: #e7f0ff; color: #1877f2; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 12px; backdrop-filter: blur(2px); }
    .modal-content { background: white; padding: 16px; border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }

    .btn-close-large {
      background: rgba(0,0,0,0.06);
      border: none;
      color: #4a5568;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      min-height: auto;
      padding: 0;
    }

    .image-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .btn-add-img-card {
      width: 84px;
      height: 84px;
      min-height: 84px;
      border-radius: 8px;
      font-size: 26px;
      padding: 0;
      background: #f8fafc;
      color: #2d3748;
      border: 2px dashed #cbd5e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-add-img-card:active { background: #e2e8f0; }

    .image-fields-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; align-items: center; }
    
    .image-field-item { 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      gap: 4px; 
      background: #f8fafc; 
      padding: 4px; 
      border: 1px solid #cbd5e0; 
      border-radius: 8px; 
      position: relative;
      width: 84px;
    }
    .image-field-item img { width: 74px; height: 74px; object-fit: cover; border-radius: 6px; }
    .image-field-actions { display: flex; gap: 4px; width: 100%; justify-content: center; }
    
    .btn-move-top {
      position: absolute;
      top: 6px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      width: 22px;
      height: 22px;
      min-height: 22px;
      border-radius: 4px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      z-index: 3;
    }
    .btn-move-top.left { left: 6px; }
    .btn-move-top.right { right: 6px; }

    .btn-action-icon {
      flex: 1;
      height: 24px;
      min-height: 24px;
      padding: 0;
      font-size: 11px;
      border-radius: 4px;
      line-height: 1;
    }

    .image-viewer-modal { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.92); 
      justify-content: center; 
      align-items: center; 
      z-index: 2000; 
    }
    .viewer-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .viewer-track::-webkit-scrollbar { display: none; }
    .viewer-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-slide img {
      max-width: 95%;
      max-height: 85vh;
      object-fit: contain;
    }
    .viewer-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.25);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 24px;
      z-index: 2100;
      padding: 0;
    }
    .viewer-btn.prev { left: 12px; }
    .viewer-btn.next { right: 12px; }

    .close-viewer-btn { 
      position: absolute; 
      top: 16px; 
      right: 16px; 
      color: white; 
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px; 
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer; 
      z-index: 2200; 
    }

    .floating-add-btn {
      position: fixed; 
      bottom: 20px; 
      left: 16px; 
      z-index: 900; 
      background: #28a745; 
      color: white; 
      border-radius: 30px; 
      padding: 12px 18px; 
      font-size: 14px; 
      font-weight: bold; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.3); 
      width: auto; 
    }

    @media (min-width: 768px) {
      body { max-width: 1400px; margin: 0 auto; padding: 24px; }
      .controls { flex-direction: row; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) !important; gap: 16px; }
      .floating-add-btn { bottom: 30px; left: 30px; }
    }
  </style>
</head>
<body>

<header>
  <h2>📖 Книга Рецептів</h2>
  <button class="menu-toggle-btn" onclick="toggleMenu(event)">☰</button>
  
  <div id="dropdownMenu" class="dropdown-menu">
    <button class="btn-secondary" onclick="exportData(); closeMenu();">💾 Експорт JSON</button>
    <button class="btn-secondary" onclick="document.getElementById('fileInput').click(); closeMenu();">📂 Імпорт JSON</button>
    <button class="btn-excel" onclick="exportExcelData(); closeMenu();">💾 Експорт Excel</button>
    <button class="btn-excel" onclick="document.getElementById('excelInput').click(); closeMenu();">📂 Імпорт Excel</button>
  </div>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Пошук..." oninput="render()">
  <select id="categoryFilter" onchange="render()">
    <option value="">Усі категорії</option>
  </select>

  <div class="grid-control-box">
    <span>📱 Плиток в ряд:</span>
    <select id="colsSelect" onchange="changeGridColumns(this.value)">
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
  </div>

  <input type="file" id="fileInput" accept=".json,application/json" style="display:none" onchange="importData(event)">
  <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="importExcelData(event)">
</div>

<div id="recipesGrid" class="grid"></div>

<button class="floating-add-btn" onclick="openAddModal()">➕ Додати рецепт</button>

<!-- Модальне вікно додавання -->
<div id="addModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>➕ Новий рецепт</h3>
      <button type="button" class="btn-close-large" onclick="closeModal('addModal')">✕</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="title" placeholder="Назва рецепту *" required>
      <input type="text" id="category" placeholder="Категорія">
      
      <div class="image-section-header">
        <label style="font-size:12px; font-weight:bold; color:#555;">Картинки:</label>
      </div>
      <div id="addImagesContainer" class="image-fields-list"></div>

      <input type="text" id="link" placeholder="🔗 Посилання на джерело">
      <textarea id="content" placeholder="📝 Текст рецепту" rows="3"></textarea>
      <textarea id="description" placeholder="📌 Нотатки" rows="2"></textarea>
      
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button type="button" onclick="addRecipe()" style="flex:1;">Зберегти</button>
        <button type="button" class="btn-danger" style="flex:1;" onclick="closeModal('addModal')">Скасувати</button>
      </div>
    </div>
  </div>
</div>

<!-- Модальне вікно редагування -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>✏️ Редагувати рецепт</h3>
      <div style="display:flex; gap:8px; align-items:center;">
        <button type="button" class="btn-icon-danger" onclick="deleteCurrentRecipe()">🗑️</button>
        <button type="button" class="btn-close-large" onclick="closeModal('editModal')">✕</button>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <input type="hidden" id="editId">
      <input type="text" id="editTitle" placeholder="Назва *" required>
      <input type="text" id="editCategory" placeholder="Категорія">
      
      <div class="image-section-header">
        <label style="font-size:12px; font-weight:bold; color:#555;">Картинки:</label>
      </div>
      <div id="editImagesContainer" class="image-fields-list"></div>

      <input type="text" id="editLink" placeholder="🔗 Посилання">
      <textarea id="editContent" placeholder="📝 Текст" rows="3"></textarea>
      <textarea id="editDescription" placeholder="📌 Нотатки" rows="2"></textarea>
      
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button type="button" onclick="saveEdit()" style="flex:1;">Зберегти</button>
        <button type="button" class="btn-danger" style="flex:1;" onclick="closeModal('editModal')">Скасувати</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="multiImageInput" accept="image/*" multiple style="display:none">

<!-- Модальне вікно опису/нотаток -->
<div id="descModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="descModalTitle"></h3>
      <button type="button" class="btn-close-large" onclick="closeModal('descModal')">✕</button>
    </div>
    <div id="descModalBody" style="display:flex; flex-direction:column; gap:10px; font-size:13px; white-space:pre-wrap; max-height:60vh; overflow-y:auto; background:#f8fafc; padding:10px; border-radius:8px;"></div>
    <button type="button" class="btn-secondary" onclick="closeModal('descModal')">Закрити</button>
  </div>
</div>

<!-- Модальне вікно перегляду та гортання фото -->
<div id="imageViewer" class="image-viewer-modal" onclick="closeViewerOnBackground(event)">
  <button class="close-viewer-btn" onclick="closeModal('imageViewer')">✕</button>
  <div class="viewer-container">
    <button class="viewer-btn prev" onclick="scrollViewer(-1)">‹</button>
    <div id="viewerTrack" class="viewer-track"></div>
    <button class="viewer-btn next" onclick="scrollViewer(1)">›</button>
  </div>
</div>

<script>
  let recipes = [];
  let db;

  // Ініціалізація IndexedDB замість localStorage
  function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('RecipeBookDB', 1);
      
      request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains('recipes')) {
          db.createObjectStore('recipes', { keyPath: 'id' });
        }
      };

      request.onsuccess = (e) => {
        db = e.target.result;
        resolve();
      };

      request.onerror = (e) => {
        console.error('Помилка відкриття БД:', e);
        reject(e);
      };
    });
  }

  async function loadRecipesFromDB() {
    return new Promise((resolve) => {
      const transaction = db.transaction(['recipes'], 'readonly');
      const store = transaction.objectStore('recipes');
      const request = store.getAll();

      request.onsuccess = () => {
        let loaded = request.result || [];
        // Міграція даних зі старих версій
        recipes = loaded.map(r => {
          let imgs = r.images || [];
          if (imgs.length === 0 && r.image) imgs = [r.image];
          return { ...r, images: imgs };
        });
        resolve();
      };
    });
  }

  async function migrateFromLocalStorage() {
    try {
      const localData = localStorage.getItem('my_recipes');
      if (localData) {
        const parsed = JSON.parse(localData);
        if (Array.isArray(parsed) && parsed.length > 0) {
          const transaction = db.transaction(['recipes'], 'readwrite');
          const store = transaction.objectStore('recipes');
          parsed.forEach(r => store.put(r));
          localStorage.removeItem('my_recipes');
        }
      }
    } catch(e) {
      console.log('Міграція з localStorage не потрібна або завершилася з помилкою');
    }
  }

  let tempAddImages = [];
  let tempEditImages = [];
  let activeModalId = null;

  window.addEventListener('popstate', function(event) {
    if (activeModalId) {
      closeModal(activeModalId, true);
    }
  });

  function openModal(modalId) {
    const modal = document.getElementById(modalId);
    if (!modal) return;
    
    if (activeModalId && activeModalId !== modalId) {
      document.getElementById(activeModalId).style.display = 'none';
    }

    modal.style.display = 'flex';
    activeModalId = modalId;
    history.pushState({ modalOpen: true, modalId: modalId }, '');
  }

  function closeModal(modalId, isPopState = false) {
    const modal = document.getElementById(modalId);
    if (modal) modal.style.display = 'none';

    if (activeModalId === modalId) {
      activeModalId = null;
    }

    if (!isPopState && history.state && history.state.modalOpen) {
      history.back();
    }
  }

  function closeViewerOnBackground(e) {
    if (e.target.id === 'imageViewer' || e.target.classList.contains('viewer-slide')) {
      closeModal('imageViewer');
    }
  }

  function toggleMenu(e) { e.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('show'); }
  function closeMenu() { document.getElementById('dropdownMenu').classList.remove('show'); }
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('dropdownMenu');
    if (menu.classList.contains('show') && !menu.contains(e.target)) closeMenu();
  });

  function changeGridColumns(cols) {
    const root = document.documentElement;
    root.style.setProperty('--cols-count', cols);
    
    if (cols >= 4) {
      root.style.setProperty('--card-title-size', '10px');
      root.style.setProperty('--img-height', '80px');
      root.style.setProperty('--btn-height', '22px');
      root.style.setProperty('--btn-icon-size', '10px');
      root.style.setProperty('--card-padding', '3px 4px');
      root.style.setProperty('--btn-slider-size', '16px');
      root.style.setProperty('--btn-slider-font', '9px');
      root.style.setProperty('--link-font-size', '8px');
    } else if (cols == 3) {
      root.style.setProperty('--card-title-size', '11px');
      root.style.setProperty('--img-height', '105px');
      root.style.setProperty('--btn-height', '25px');
      root.style.setProperty('--btn-icon-size', '11px');
      root.style.setProperty('--card-padding', '4px 5px');
      root.style.setProperty('--btn-slider-size', '18px');
      root.style.setProperty('--btn-slider-font', '10px');
      root.style.setProperty('--link-font-size', '9px');
    } else if (cols == 2) {
      root.style.setProperty('--card-title-size', '13px');
      root.style.setProperty('--img-height', '140px');
      root.style.setProperty('--btn-height', '30px');
      root.style.setProperty('--btn-icon-size', '13px');
      root.style.setProperty('--card-padding', '6px 8px');
      root.style.setProperty('--btn-slider-size', '22px');
      root.style.setProperty('--btn-slider-font', '12px');
      root.style.setProperty('--link-font-size', '10px');
    } else {
      root.style.setProperty('--card-title-size', '16px');
      root.style.setProperty('--img-height', '220px');
      root.style.setProperty('--btn-height', '36px');
      root.style.setProperty('--btn-icon-size', '15px');
      root.style.setProperty('--card-padding', '8px 10px');
      root.style.setProperty('--btn-slider-size', '26px');
      root.style.setProperty('--btn-slider-font', '14px');
      root.style.setProperty('--link-font-size', '11px');
    }
    localStorage.setItem('grid_cols', cols);
  }
  const savedCols = localStorage.getItem('grid_cols') || '2';
  document.getElementById('colsSelect').value = savedCols;
  changeGridColumns(savedCols);

  function getLinkInfo(urlStr) {
    if (!urlStr) return null;
    try {
      const host = new URL(urlStr).hostname.toLowerCase();
      if (host.includes('youtube.com') || host.includes('youtu.be')) return { label: 'YouTube', class: 'url-youtube' };
      if (host.includes('instagram.com')) return { label: 'Instagram', class: 'url-instagram' };
      if (host.includes('tiktok.com')) return { label: 'TikTok', class: 'url-tiktok' };
      if (host.includes('facebook.com')) return { label: 'Facebook', class: 'url-facebook' };
      return { label: 'Джерело', class: 'url-default' };
    } catch (e) {
      return { label: 'Джерело', class: 'url-default' };
    }
  }

  function renderImageFields(mode) {
    const container = document.getElementById(mode === 'add' ? 'addImagesContainer' : 'editImagesContainer');
    const imgs = mode === 'add' ? tempAddImages : tempEditImages;
    container.innerHTML = '';

    imgs.forEach((imgBase64, index) => {
      const item = document.createElement('div');
      item.className = 'image-field-item';
      
      const prevDisabled = index === 0 ? 'disabled style="opacity:0.3;"' : '';
      const nextDisabled = index === imgs.length - 1 ? 'disabled style="opacity:0.3;"' : '';

      item.innerHTML = `
        <button type="button" class="btn-move-top left" ${prevDisabled} onclick="moveImage('${mode}', ${index}, -1)" title="Перемістити вліво">◄</button>
        <button type="button" class="btn-move-top right" ${nextDisabled} onclick="moveImage('${mode}', ${index}, 1)" title="Перемістити вправо">►</button>
        <img src="${imgBase64}">
        <input type="file" id="${mode}_replace_${index}" accept="image/*" style="display:none" onchange="handleImageReplace(event, '${mode}', ${index})">
        <div class="image-field-actions">
          <button type="button" class="btn-secondary btn-action-icon" onclick="document.getElementById('${mode}_replace_${index}').click()" title="Замінити">🔄</button>
          <button type="button" class="btn-danger btn-action-icon" onclick="removeImageField('${mode}', ${index})" title="Видалити">🗑️</button>
        </div>
      `;
      container.appendChild(item);
    });

    const addCardBtn = document.createElement('button');
    addCardBtn.type = 'button';
    addCardBtn.className = 'btn-add-img-card';
    addCardBtn.innerHTML = '➕';
    addCardBtn.title = 'Додати фото';
    addCardBtn.onclick = () => triggerMultipleImageSelect(mode);
    container.appendChild(addCardBtn);
  }

  function moveImage(mode, index, direction) {
    const imgs = mode === 'add' ? tempAddImages : tempEditImages;
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= imgs.length) return;
    
    const temp = imgs[index];
    imgs[index] = imgs[newIndex];
    imgs[newIndex] = temp;
    
    renderImageFields(mode);
  }

  function triggerMultipleImageSelect(mode) {
    const multiInput = document.getElementById('multiImageInput');
    multiInput.value = '';
    multiInput.onchange = async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const processedImages = await Promise.all(
        files.map(file => new Promise(resolve => processImageFile(file, resolve)))
      );

      if (mode === 'add') {
        tempAddImages.push(...processedImages);
      } else {
        tempEditImages.push(...processedImages);
      }
      renderImageFields(mode);
    };
    multiInput.click();
  }

  function handleImageReplace(e, mode, index) {
    const file = e.target.files[0];
    if (file) {
      processImageFile(file, (base64) => {
        if (mode === 'add') tempAddImages[index] = base64;
        else tempEditImages[index] = base64;
        renderImageFields(mode);
      });
    }
  }

  function removeImageField(mode, index) {
    if (mode === 'add') tempAddImages.splice(index, 1);
    else tempEditImages.splice(index, 1);
    renderImageFields(mode);
  }

  function processImageFile(file, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 600;
        let width = img.width;
        let height = img.height;

        if (width > MAX_WIDTH) {
          height = Math.round((height * MAX_WIDTH) / width);
          width = MAX_WIDTH;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function scrollSlider(trackId, direction) {
    const track = document.getElementById(trackId);
    track.scrollBy({ left: direction * track.clientWidth, behavior: 'smooth' });
  }

  function openDescModal(id, type) {
    const r = recipes.find(item => item.id === id);
    if (!r) return;
    document.getElementById('descModalTitle').innerText = r.title;
    let html = '';
    
    if (type === 'content' && r.content) {
      html = `<div><b>📝 Опис:</b>\n\n${r.content}</div>`;
    } else if (type === 'notes' && r.description) {
      html = `<div style="color:#744210; background:#fffbea; padding:10px; border-radius:6px; border:1px dashed #fbd38d;"><b>📌 Нотатки:</b>\n\n${r.description}</div>`;
    }
    
    document.getElementById('descModalBody').innerHTML = html;
    openModal('descModal');
  }

  function openImageViewer(id, initialIndex) {
    const r = recipes.find(item => item.id === id);
    if (!r) return;
    const imgs = r.images && r.images.length ? r.images : (r.image ? [r.image] : []);
    if (!imgs.length) return;

    const track = document.getElementById('viewerTrack');
    track.innerHTML = imgs.map(src => `
      <div class="viewer-slide">
        <img src="${src}">
      </div>
    `).join('');

    openModal('imageViewer');

    setTimeout(() => {
      track.scrollLeft = initialIndex * track.clientWidth;
    }, 50);
  }

  function scrollViewer(direction) {
    const track = document.getElementById('viewerTrack');
    track.scrollBy({ left: direction * track.clientWidth, behavior: 'smooth' });
  }

  function openAddModal() {
    document.getElementById('title').value = '';
    document.getElementById('category').value = '';
    document.getElementById('link').value = '';
    document.getElementById('content').value = '';
    document.getElementById('description').value = '';
    tempAddImages = [];
    renderImageFields('add');
    openModal('addModal');
  }

  async function addRecipe() {
    const titleInput = document.getElementById('title');
    const titleVal = titleInput ? titleInput.value.trim() : '';
    
    if (!titleVal) {
      alert('Будь ласка, введіть назву рецепту!');
      return;
    }

    let rawLink = document.getElementById('link').value.trim();
    if (rawLink && !/^https?:\/\//i.test(rawLink)) rawLink = 'https://' + rawLink;

    const newRecipe = {
      id: Date.now().toString(),
      title: titleVal,
      category: document.getElementById('category').value.trim() || 'Загальні',
      images: [...tempAddImages],
      image: tempAddImages[0] || "",
      link: rawLink,
      content: document.getElementById('content').value || "",
      description: document.getElementById('description').value || ""
    };

    recipes.push(newRecipe);
    
    const saved = await saveToStorage(newRecipe);
    if (saved) {
      closeModal('addModal');
    } else {
      recipes.pop();
    }
  }

  function openEditModal(id) {
    const r = recipes.find(item => item.id === id);
    if (!r) return;
    document.getElementById('editId').value = r.id;
    document.getElementById('editTitle').value = r.title || '';
    document.getElementById('editCategory').value = r.category || '';
    document.getElementById('editLink').value = r.link || '';
    document.getElementById('editContent').value = r.content || '';
    document.getElementById('editDescription').value = r.description || '';
    
    tempEditImages = r.images && r.images.length ? [...r.images] : (r.image ? [r.image] : []);
    renderImageFields('edit');
    openModal('editModal');
  }

  async function saveEdit() {
    const id = document.getElementById('editId').value;
    const titleVal = document.getElementById('editTitle').value.trim();
    if (!titleVal) {
      alert('Будь ласка, введіть назву рецепту!');
      return;
    }

    const idx = recipes.findIndex(r => r.id === id);
    if (idx !== -1) {
      const oldRecipe = { ...recipes[idx] };
      let rawLink = document.getElementById('editLink').value.trim();
      if (rawLink && !/^https?:\/\//i.test(rawLink)) rawLink = 'https://' + rawLink;

      const updatedRecipe = {
        id,
        title: titleVal,
        category: document.getElementById('editCategory').value.trim() || 'Загальні',
        images: [...tempEditImages],
        image: tempEditImages[0] || "",
        link: rawLink,
        content: document.getElementById('editContent').value || "",
        description: document.getElementById('editDescription').value || ""
      };

      recipes[idx] = updatedRecipe;

      const saved = await saveToStorage(updatedRecipe);
      if (saved) {
        closeModal('editModal');
      } else {
        recipes[idx] = oldRecipe;
      }
    }
  }

  async function deleteCurrentRecipe() {
    const id = document.getElementById('editId').value;
    if (confirm("Видалити цей рецепт?")) {
      recipes = recipes.filter(r => r.id !== id);
      await removeFromStorage(id);
      updateCategories();
      render();
      closeModal('editModal');
    }
  }

  async function saveToStorage(singleRecipe = null) {
    try {
      const transaction = db.transaction(['recipes'], 'readwrite');
      const store = transaction.objectStore('recipes');
      
      if (singleRecipe) {
        store.put(singleRecipe);
      } else {
        recipes.forEach(r => store.put(r));
      }

      await new Promise((resolve, reject) => {
        transaction.oncomplete = () => resolve();
        transaction.onerror = (e) => reject(e);
      });

      updateCategories();
      render();
      return true;
    } catch (e) {
      alert('⚠️ Помилка збереження даних!');
      return false;
    }
  }

  async function removeFromStorage(id) {
    return new Promise((resolve) => {
      const transaction = db.transaction(['recipes'], 'readwrite');
      const store = transaction.objectStore('recipes');
      store.delete(id);
      transaction.oncomplete = () => resolve();
    });
  }

  function updateCategories() {
    const categories = [...new Set(recipes.map(r => r.category))];
    const select = document.getElementById('categoryFilter');
    const val = select.value;
    select.innerHTML = '<option value="">Усі категорії</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
    select.value = val;
  }

  function render() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const grid = document.getElementById('recipesGrid');
    grid.innerHTML = '';

    const filtered = recipes.filter(r => {
      const matchCat = !category || r.category === category;
      const matchSearch = (r.title && r.title.toLowerCase().includes(search)) || 
                          (r.content && r.content.toLowerCase().includes(search)) ||
                          (r.description && r.description.toLowerCase().includes(search));
      return matchCat && matchSearch;
    });

    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';

      const imgs = r.images && r.images.length ? r.images : (r.image ? [r.image] : []);
      let sliderHtml = '';
      
      if (imgs.length > 0) {
        const trackId = `track_${r.id}`;
        const slides = imgs.map((imgSrc, idx) => `
          <img src="${imgSrc}" class="slider-slide" loading="lazy" onclick="openImageViewer('${r.id}', ${idx})">
        `).join('');

        const navBtns = imgs.length > 1 
          ? `<button class="slider-btn prev" onclick="scrollSlider('${trackId}', -1)">‹</button>
             <button class="slider-btn next" onclick="scrollSlider('${trackId}', 1)">›</button>` 
          : '';
        
        sliderHtml = `
          <div class="slider-container">
            ${navBtns}
            <div id="${trackId}" class="slider-track">${slides}</div>
          </div>`;
      } else {
        sliderHtml = `<div class="slider-container"><div class="no-img-placeholder">🍳</div></div>`;
      }

      let linkHtml = '';
      if (r.link) {
        const info = getLinkInfo(r.link);
        if (info) linkHtml = `<a href="${r.link}" target="_blank" class="social-link ${info.class}">${info.label}</a>`;
      }

      const descDisabled = !r.content ? 'disabled' : '';
      const notesDisabled = !r.description ? 'disabled' : '';

      let descBtnHtml = `<button class="btn-icon-only btn-icon-desc" ${descDisabled} onclick="openDescModal('${r.id}', 'content')">📝</button>`;
      let notesBtnHtml = `<button class="btn-icon-only btn-icon-notes" ${notesDisabled} onclick="openDescModal('${r.id}', 'notes')">📌</button>`;

      card.innerHTML = `
        <div class="card-header-box">
          <h3>${r.title}</h3>
        </div>
        ${sliderHtml}
        <div class="card-footer-box">
          ${linkHtml}
          <div class="card-buttons-row">
            ${descBtnHtml}
            ${notesBtnHtml}
            <button class="btn-icon-only btn-icon-edit" onclick="openEditModal('${r.id}')">✏️</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function exportData() {
    if (!recipes.length) return alert('Немає рецептів!');
    const dataUri = "data:application/json;base64," + btoa(unescape(encodeURIComponent(JSON.stringify(recipes, null, 2))));
    const a = document.createElement('a');
    a.href = dataUri;
    a.download = `recipes_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  async function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(event) {
      try {
        const imported = JSON.parse(event.target.result);
        if (Array.isArray(imported)) {
          recipes = imported;
          await saveToStorage();
          alert('Дані успішно імпортовано!');
        } else {
          alert('Невірний формат файлу!');
        }
      } catch (err) {
        alert('Помилка зчитування JSON!');
      }
    };
    reader.readAsText(file);
  }

  function exportExcelData() {
    if (!recipes.length) return alert('Немає рецептів!');
    const excelRows = recipes.map(r => ({
      ID: r.id,
      Назва: r.title,
      Категорія: r.category,
      Посилання: r.link,
      Опис: r.content,
      Нотатки: r.description,
      Зображення: (r.images || []).join(';')
    }));

    const worksheet = XLSX.utils.json_to_sheet(excelRows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Рецепти");
    XLSX.writeFile(workbook, `recipes_excel_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  async function importExcelData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(event) {
      try {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet);

        if (Array.isArray(json) && json.length > 0) {
          recipes = json.map((item, idx) => {
            const rawImgs = item['Зображення'] || item['Images'] || '';
            const imgsArray = typeof rawImgs === 'string' && rawImgs.length > 0 ? rawImgs.split(';') : [];
            return {
              id: String(item['ID'] || Date.now() + idx),
              title: item['Назва'] || item['Title'] || 'Без назви',
              category: item['Категорія'] || item['Category'] || 'Загальні',
              link: item['Посилання'] || item['Link'] || '',
              content: item['Опис'] || item['Content'] || '',
              description: item['Нотатки'] || item['Description'] || '',
              images: imgsArray,
              image: imgsArray[0] || ''
            };
          });
          await saveToStorage();
          alert('Excel-дані успішно імпортовано!');
        } else {
          alert('Файл порожній або має некоректний формат!');
        }
      } catch (err) {
        alert('Помилка імпорту Excel файлу!');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // Запуск із завантаженням IndexedDB
  initDB().then(async () => {
    await migrateFromLocalStorage();
    await loadRecipesFromDB();
    updateCategories();
    render();
  });
</script>
