<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Книга Рецептів</title>
  <!-- Бібліотека для роботи з Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* Основні стилі */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { padding: 15px; background: #f4f4f9; color: #333; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Соцмережі у шапці */
    .social-container { display: flex; gap: 15px; align-items: center; }
    .social-btn {
      background: none; border: none; padding: 0; cursor: pointer;
      color: #40E0D0; display: inline-flex; text-decoration: none;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .social-btn:hover { color: #00CED1; transform: scale(1.15); }
    .social-btn:active { transform: scale(0.95); }

    /* Елементи управління */
    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input, select, button, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; }
    button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    button.btn-secondary { background: #007bff; }
    button.btn-excel { background: #1d6f42; }
    
    button.btn-edit { background: #40E0D0; color: #fff; font-size: 16px; padding: 8px 12px; width: auto; }
    button.btn-edit:hover { background: #00CED1; }
    button.btn-danger { background: #dc3545; color: #fff; font-size: 16px; padding: 8px 12px; width: auto; }
    button.btn-danger:hover { background: #c82333; }
    button.btn-warning { background: #ffc107; color: #000; }
    
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-group button { flex: 1; min-width: 140px; }
    
    /* Сітка та картки */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    .card-preview { width: 100%; height: 180px; object-fit: cover; background: #e9ecef; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #6c757d; cursor: pointer; }
    .card-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
    .card h3 { font-size: 18px; color: #111; }
    .badge { display: inline-block; background: #e0e0e0; padding: 3px 8px; border-radius: 5px; font-size: 12px; margin-right: 4px; margin-bottom: 4px; }
    .media-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; }
    .media-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .text-content { max-height: 120px; overflow-y: auto; white-space: pre-wrap; background: #fafafa; padding: 8px; border-radius: 6px; font-size: 13px; }
    .form-group { display: flex; flex-direction: column; gap: 10px; background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .card-actions { display: flex; gap: 10px; margin-top: auto; align-items: center; }

    .social-link { display: inline-flex; align-items: center; gap: 8px; font-weight: bold; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; width: fit-content; }
    .social-link.fb { background: #e7f3ff; color: #1877f2; }
    .social-link.insta { background: #fdf0f5; color: #e4405f; }
    .social-link.tiktok { background: #f1f1f1; color: #000000; }
    .social-link.yt { background: #ffe6e6; color: #ff0000; }
    .social-link.image-btn { background: #e6f9f7; color: #008b8b; width: 100%; justify-content: center; }

    .file-upload-box { border: 1px dashed #007bff; padding: 10px; border-radius: 8px; background: #f0f7ff; text-align: center; }

    /* Модальні вікна */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    /* Модальне вікно перегляду скріншотів на весь екран */
    .image-viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
    .image-viewer-modal img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    .close-viewer { position: absolute; top: 15px; right: 20px; color: white; font-size: 30px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>📖 Книга Рецептів</h1>
  <div class="social-container">
    <a href="https://facebook.com" target="_blank" class="social-btn" aria-label="Facebook">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
      </svg>
    </a>
    <a href="https://instagram.com" target="_blank" class="social-btn" aria-label="Instagram">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
    </a>
  </div>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Пошук по назві, тегам чи тексту..." oninput="render()">
  <select id="categoryFilter" onchange="render()">
    <option value="">Усі категорії</option>
  </select>
  <div class="btn-group">
    <button class="btn-secondary" onclick="exportData()">💾 Експорт JSON</button>
    <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📂 Імпорт JSON</button>
    <button class="btn-excel" onclick="document.getElementById('excelInput').click()">📊 Імпорт Excel (.xlsx)</button>
    
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importData(event)">
    <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="importExcelData(event)">
  </div>
</div>

<!-- Форма додавання -->
<details class="form-group">
  <summary><b>➕ Додати новий рецепт / скріншот</b></summary>
  <form id="recipeForm" onsubmit="addRecipe(event)" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
    <input type="text" id="title" placeholder="Назва рецепту" required>
    <input type="text" id="category" placeholder="Категорія (напр. Випічка, Вибране)" required>
    <input type="text" id="tags" placeholder="Теги через кому (напр. скріншот, салат)">
    
    <!-- Вибір типу вмісту -->
    <select id="type">
      <option value="image">📱 Зображення / Скріншот з телефону</option>
      <option value="text">Текстовий рецепт</option>
      <option value="youtube">YouTube Посилання</option>
      <option value="tiktok">TikTok Посилання</option>
      <option value="facebook">Facebook Посилання</option>
      <option value="instagram">Instagram Посилання</option>
    </select>
    
    <!-- Блок завантаження скріншота / фото -->
    <div class="file-upload-box">
      <label style="display:block; margin-bottom: 5px; font-weight:bold;">📲 Виберіть скріншот або фото з телефону:</label>
      <input type="file" id="imageFile" accept="image/*" onchange="handleImageUpload(event, 'add')">
      <div style="margin: 5px 0; font-size: 12px; color: #666;">або вкажіть URL посилання на картинку:</div>
      <input type="url" id="image" placeholder="https://example.com/image.jpg">
    </div>

    <input type="url" id="link" placeholder="🔗 Джерело / Посилання (необов'язково)">
    <textarea id="content" placeholder="📝 Текст рецепту (необов'язково)" rows="3"></textarea>
    <textarea id="description" placeholder="Короткі нотатки" rows="2"></textarea>
    <button type="submit">Зберегти рецепт</button>
  </form>
</details>

<div id="recipesGrid" class="grid"></div>

<!-- Модальне вікно редагування -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h2>✏️ Редагування рецепта</h2>
    <form id="editForm" onsubmit="saveEdit(event)" style="display: flex; flex-direction: column; gap: 10px;">
      <input type="hidden" id="editId">
      <input type="text" id="editTitle" placeholder="Назва рецепту" required>
      <input type="text" id="editCategory" placeholder="Категорія" required>
      <input type="text" id="editTags" placeholder="Теги через кому">
      <select id="editType">
        <option value="image">📱 Зображення / Скріншот</option>
        <option value="text">Текстовий рецепт</option>
        <option value="youtube">YouTube Посилання</option>
        <option value="tiktok">TikTok Посилання</option>
        <option value="facebook">Facebook Посилання</option>
        <option value="instagram">Instagram Посилання</option>
      </select>
      
      <div class="file-upload-box">
        <label style="display:block; margin-bottom: 5px; font-weight:bold;">🖼️ Змінити скріншот / фото:</label>
        <input type="file" id="editImageFile" accept="image/*" onchange="handleImageUpload(event, 'edit')">
        <div style="margin: 5px 0; font-size: 12px; color: #666;">або URL посилання:</div>
        <input type="url" id="editImage" placeholder="https://example.com/image.jpg">
        <button type="button" class="btn-warning" style="margin-top: 8px; font-size: 12px; padding: 5px; width: 100%;" onclick="removeImage()">🗑️ Видалити фото</button>
      </div>

      <input type="url" id="editLink" placeholder="🔗 Посилання (URL)">
      <textarea id="editContent" placeholder="📝 Текст рецепту" rows="3"></textarea>
      <textarea id="editDescription" placeholder="Короткі нотатки" rows="2"></textarea>
      <div style="display: flex; gap: 10px;">
        <button type="submit" style="flex: 1;">Зберегти зміни</button>
        <button type="button" class="btn-danger" style="flex: 1;" onclick="closeEditModal()">Скасувати</button>
      </div>
    </form>
  </div>
</div>

<!-- Модальне вікно для повноекранного перегляду скріншота -->
<div id="imageViewer" class="image-viewer-modal" onclick="closeImageViewer()">
  <span class="close-viewer">&times;</span>
  <img id="fullImage" src="" alt="Скріншот рецепта">
</div>

<script>
  let recipes = JSON.parse(localStorage.getItem('my_recipes')) || [];
  let tempAddBase64 = "";
  let tempEditBase64 = "";
  let isImageRemoved = false;

  // 🆔 Формування ID типу 202609030001
  function generateCustomId() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const datePrefix = `${year}${month}${day}`;

    const todayRecipes = recipes.filter(r => r.id && r.id.toString().startsWith(datePrefix));
    const nextNumber = String(todayRecipes.length + 1).padStart(4, '0');

    return `${datePrefix}${nextNumber}`;
  }

  function saveToStorage() {
    localStorage.setItem('my_recipes', JSON.stringify(recipes));
    updateCategories();
    render();
  }

  // 📲 Завантаження та стиснення зображень/скріншотів
  function handleImageUpload(event, mode) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1200; // Підвищена чіткість для читання тексту на скріншоті
        const scaleSize = MAX_WIDTH / img.width;
        
        if (img.width > MAX_WIDTH) {
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
        } else {
          canvas.width = img.width;
          canvas.height = img.height;
        }

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        // Стискаємо в JPEG з якістю 75%
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);

        if (mode === 'add') {
          tempAddBase64 = compressedBase64;
        } else {
          tempEditBase64 = compressedBase64;
          isImageRemoved = false;
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removeImage() {
    tempEditBase64 = "";
    document.getElementById('editImage').value = "";
    document.getElementById('editImageFile').value = "";
    isImageRemoved = true;
    alert("Зображення позначено на видалення.");
  }

  // 🔍 Повноекранний перегляд скріншота
  function openImageViewer(imgSrc) {
    const viewer = document.getElementById('imageViewer');
    const fullImg = document.getElementById('fullImage');
    fullImg.src = imgSrc;
    viewer.style.display = 'flex';
  }

  function closeImageViewer() {
    document.getElementById('imageViewer').style.display = 'none';
  }

  // ➕ Додавання рецепта
  function addRecipe(e) {
    e.preventDefault();
    const urlImage = document.getElementById('image').value.trim();
    const finalImage = tempAddBase64 || urlImage;

    // Перевірка: якщо вибрано тип "Зображення/Скріншот", але його не додано
    if (document.getElementById('type').value === 'image' && !finalImage) {
      alert('⚠️ Будь ласка, завантажте скріншот або вкажіть URL картинки!');
      return;
    }
    
    const newRecipe = {
      id: generateCustomId(),
      title: document.getElementById('title').value,
      category: document.getElementById('category').value.trim(),
      tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t),
      type: document.getElementById('type').value,
      image: finalImage,
      link: document.getElementById('link').value.trim(),
      content: document.getElementById('content').value,
      description: document.getElementById('description').value
    };
    
    recipes.push(newRecipe);
    saveToStorage();
    document.getElementById('recipeForm').reset();
    tempAddBase64 = "";
  }

  function openEditModal(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;

    tempEditBase64 = "";
    isImageRemoved = false;
    
    document.getElementById('editId').value = recipe.id;
    document.getElementById('editTitle').value = recipe.title;
    document.getElementById('editCategory').value = recipe.category;
    document.getElementById('editTags').value = recipe.tags ? recipe.tags.join(', ') : '';
    document.getElementById('editType').value = recipe.type || 'image';
    document.getElementById('editImage').value = recipe.image && !recipe.image.startsWith('data:') ? recipe.image : '';
    document.getElementById('editLink').value = recipe.link || '';
    document.getElementById('editContent').value = recipe.content || '';
    document.getElementById('editDescription').value = recipe.description || '';

    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    tempEditBase64 = "";
    isImageRemoved = false;
  }

  function saveEdit(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const recipeIndex = recipes.findIndex(r => r.id === id);

    if (recipeIndex !== -1) {
      const urlImage = document.getElementById('editImage').value.trim();
      
      let finalImage = "";
      if (!isImageRemoved) {
        finalImage = tempEditBase64 || urlImage || recipes[recipeIndex].image || "";
      }

      recipes[recipeIndex] = {
        id: id,
        title: document.getElementById('editTitle').value,
        category: document.getElementById('editCategory').value.trim(),
        tags: document.getElementById('tags').value ? document.getElementById('editTags').value.split(',').map(t => t.trim()).filter(t => t) : [],
        type: document.getElementById('editType').value,
        image: finalImage,
        link: document.getElementById('editLink').value.trim(),
        content: document.getElementById('editContent').value,
        description: document.getElementById('editDescription').value
      };
      saveToStorage();
      closeEditModal();
    }
  }

  function deleteRecipe(id) {
    if (confirm('Видалити цей рецепт?')) {
      recipes = recipes.filter(r => r.id !== id);
      saveToStorage();
    }
  }

  function updateCategories() {
    const categories = [...new Set(recipes.map(r => r.category))];
    const select = document.getElementById('categoryFilter');
    const currentValue = select.value;
    select.innerHTML = '<option value="">Усі категорії</option>' + 
      categories.map(c => `<option value="${c}">${c}</option>`).join('');
    select.value = currentValue;
  }

  function getYouTubeId(url) {
    if (!url) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  function getPreviewImage(recipe) {
    if (recipe.image) return recipe.image;
    if (recipe.type === 'youtube' && recipe.link) {
      const ytId = getYouTubeId(recipe.link);
      if (ytId) return `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
    }
    return null;
  }

  function getPlaceholderSVG(type) {
    if (type === 'facebook') return `📘`;
    if (type === 'instagram') return `📷`;
    if (type === 'tiktok') return '🎵';
    if (type === 'image') return '📲';
    return '🍳';
  }

  // 🖥️ Рендеринг картка-рецептів
  function render() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const grid = document.getElementById('recipesGrid');
    grid.innerHTML = '';

    const filtered = recipes.filter(r => {
      const matchesCategory = !category || r.category === category;
      const matchesSearch = r.title.toLowerCase().includes(search) || 
                            (r.description && r.description.toLowerCase().includes(search)) ||
                            (r.content && r.content.toLowerCase().includes(search)) ||
                            (r.tags && r.tags.some(t => t.toLowerCase().includes(search)));
      return matchesCategory && matchesSearch;
    });

    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      
      const imgUrl = getPreviewImage(r);
      
      // По кліку на прев'ю скріншот відкривається на весь екран
      let previewHtml = imgUrl 
        ? `<img src="${imgUrl}" class="card-preview" alt="${r.title}" loading="lazy" onclick="openImageViewer('${imgUrl}')">`
        : `<div class="card-preview">${getPlaceholderSVG(r.type)}</div>`;

      let mediaHtml = '';
      if (imgUrl) {
        mediaHtml += `<button class="social-link image-btn" onclick="openImageViewer('${imgUrl}')">🔍 Відкрити скріншот</button>`;
      }

      if (r.link) {
        if (r.type === 'youtube') {
          const ytId = getYouTubeId(r.link);
          mediaHtml += ytId ? `<div class="media-container" style="margin-top:8px;"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>` 
                            : `<a href="${r.link}" target="_blank" class="social-link yt">▶️ Дивитися на YouTube</a>`;
        } else if (r.type === 'tiktok') {
          mediaHtml += `<a href="${r.link}" target="_blank" class="social-link tiktok">🎵 Відкрити в TikTok</a>`;
        } else if (r.type === 'facebook') {
          mediaHtml += `<a href="${r.link}" target="_blank" class="social-link fb">📘 Відкрити у Facebook</a>`;
        } else if (r.type === 'instagram') {
          mediaHtml += `<a href="${r.link}" target="_blank" class="social-link insta">📷 Відкрити в Instagram</a>`;
        } else {
          mediaHtml += `<a href="${r.link}" target="_blank" class="social-link">🌐 Перейти за посиланням</a>`;
        }
      }

      let contentHtml = r.content ? `<div class="text-content">${r.content}</div>` : '';

      card.innerHTML = `
        ${previewHtml}
        <div class="card-body">
          <h3>${r.title}</h3>
          <div><span class="badge">${r.category}</span></div>
          ${r.description ? `<p><small>${r.description}</small></p>` : ''}
          ${mediaHtml}
          ${contentHtml}
          <div>${r.tags ? r.tags.map(t => `<span class="badge">#${t}</span>`).join(' ') : ''}</div>
          <div class="card-actions">
            <button class="btn-edit" title="Редагувати" onclick="openEditModal('${r.id}')">✏️</button>
            <button class="btn-danger" title="Видалити" onclick="deleteRecipe('${r.id}')">🗑️</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `recipes_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        let imported = JSON.parse(evt.target.result);

        if (!Array.isArray(imported)) {
          if (typeof imported === 'object' && imported !== null) imported = [imported];
          else { alert('❌ Некоректний JSON.'); return; }
        }

        let count = 0;
        const validTypes = ['youtube', 'tiktok', 'facebook', 'instagram', 'image', 'text'];

        imported.forEach(item => {
          const title = item.title || item.name || item.Title || '';
          if (title) {
            recipes.push({
              id: generateCustomId(),
              title: title.toString().trim(),
              category: (item.category || item.Category || 'Загальні').toString().trim(),
              tags: Array.isArray(item.tags) ? item.tags : (item.tags ? item.tags.toString().split(',').map(t => t.trim()).filter(t => t) : []),
              type: validTypes.includes((item.type || '').toLowerCase()) ? item.type.toLowerCase() : 'image',
              image: (item.image || item.img || item.photo || '').toString().trim(),
              link: (item.link || item.url || '').toString().trim(),
              content: (item.content || item.text || item.instructions || '').toString().trim(),
              description: (item.description || item.notes || '').toString().trim()
            });
            count++;
          }
        });

        if (count > 0) {
          saveToStorage();
          alert(`✅ Успішно додано ${count} рецептів/скріншотів!`);
        } else {
          alert('⚠️ У файлі не знайдено відповідних рецептів.');
        }

      } catch (err) {
        alert('❌ Помилка зчитування JSON файлу.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  function importExcelData(e) {
    const file = e.target.files[0];
    if (!file) return;

    if (typeof XLSX === 'undefined') {
      alert('❌ Бібліотеку Excel не завантажено.');
      return;
    }

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const excelRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        let count = 0;
        const validTypes = ['youtube', 'tiktok', 'facebook', 'instagram', 'image', 'text'];

        excelRows.forEach(row => {
          const getVal = (keys) => {
            for (let key of keys) {
              const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === key.toLowerCase());
              if (foundKey && row[foundKey] !== undefined) return row[foundKey];
            }
            return '';
          };

          const title = getVal(['title', 'назва', 'рецепт', 'заголовок']);
          const category = getVal(['category', 'категорія']) || 'Загальні';
          const tagsRaw = getVal(['tags', 'теги', 'мітки']);
          const type = getVal(['type', 'тип']).toString().toLowerCase();
          const image = getVal(['image', 'картинка', 'фото', 'зображення']);
          const link = getVal(['link', 'посилання', 'url']);
          const content = getVal(['content', 'вміст', 'текст']);
          const description = getVal(['description', 'опис']);

          if (title) {
            recipes.push({
              id: generateCustomId(),
              title: title.toString().trim(),
              category: category.toString().trim(),
              tags: tagsRaw ? tagsRaw.toString().split(',').map(t => t.trim()).filter(t => t) : [],
              type: validTypes.includes(type) ? type : 'image',
              image: image.toString().trim(),
              link: link.toString().trim(),
              content: content.toString().trim(),
              description: description.toString().trim()
            });
            count++;
          }
        });

        if (count > 0) {
          saveToStorage();
          alert(`✅ Успішно імпортовано ${count} рецептів із Excel!`);
        }
      } catch (err) {
        alert('❌ Помилка зчитання Excel-файлу.');
      }
      e.target.value = '';
    };
    reader.readAsArrayBuffer(file);
  }

  updateCategories();
  render();
</script>
</body>
</html>
