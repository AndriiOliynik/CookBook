<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Книга Рецептів</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      padding: 12px; 
      padding-top: calc(36px + env(safe-area-inset-top)); 
      padding-bottom: 110px; 
      background: #f4f4f9; 
      color: #333; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 14px; 
      position: relative; 
      padding-top: 6px;
    }
    header h2 { font-size: 20px; font-weight: 800; }

    .menu-toggle-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 22px;
      cursor: pointer;
      padding: 6px 12px;
      color: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      border-radius: 10px;
      padding: 8px;
      z-index: 1000;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      border: 1px solid #e2e8f0;
    }
    .dropdown-menu.show { display: flex; }
    .dropdown-menu button {
      font-size: 13px;
      min-height: 38px;
      padding: 6px 12px;
      text-align: left;
      border-radius: 6px;
    }

    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    input, select, button, textarea { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #40E0D0; }
    
    button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    button:active { opacity: 0.85; }
    button.btn-secondary { background: #007bff; }
    button.btn-excel { background: #1d6f42; }
    button.btn-danger { background: #dc3545; color: #fff; }
    button.btn-icon-danger { background: #fff0f0; color: #dc3545; border: 1px solid #ffcdd2; width: 36px; height: 36px; border-radius: 50%; padding: 0; font-size: 16px; }

    .grid-control-box { display: flex; align-items: center; gap: 8px; background: #fff; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; }
    .grid-control-box select { width: auto; flex-grow: 1; padding: 4px 8px; font-size: 13px; }

    /* Квадратні плитки (1:1) */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(var(--cols-count, 2), minmax(0, 1fr)); 
      gap: 12px; 
    }
    
    .card { 
      background: white; 
      border-radius: 12px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      border: 1px solid #edf2f7; 
      width: 100%; 
      aspect-ratio: 1 / 1;
      position: relative;
    }

    .card-header-box { 
      padding: 6px 8px; 
      display: flex; 
      flex-direction: column; 
      gap: 2px; 
      z-index: 2;
    }
    .card h3 { 
      font-size: var(--card-title-size, 13px); 
      font-weight: 700; 
      color: #1a202c; 
      line-height: 1.2; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .badge { 
      display: inline-block; 
      background: #edf2f7; 
      color: #4a5568; 
      padding: 1px 5px; 
      border-radius: 4px; 
      font-size: 9px; 
      font-weight: 500; 
      width: fit-content; 
    }

    /* Слайдер картинок у картці */
    .slider-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #e9ecef;
      overflow: hidden;
    }
    .slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .slider-track::-webkit-scrollbar { display: none; }
    .slider-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      object-fit: cover;
      cursor: pointer;
    }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.35);
      color: white;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      min-height: auto;
      font-size: 12px;
      z-index: 5;
      padding: 0;
    }
    .slider-btn.prev { left: 4px; }
    .slider-btn.next { right: 4px; }
    .no-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #a0aec0; }

    /* Підвал картки */
    .card-footer-box { 
      padding: 6px 8px; 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      margin-top: auto; 
      background: #fff;
      z-index: 2;
    }

    .card-buttons-row {
      display: flex;
      gap: 4px;
      width: 100%;
      align-items: center;
    }

    .btn-icon-only {
      font-size: 13px;
      height: 30px;
      min-height: 30px;
      padding: 0;
      border-radius: 6px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon-desc { background: #edf2f7; color: #2d3748; border: 1px solid #cbd5e0; }
    .btn-icon-notes { background: #fffbea; color: #744210; border: 1px solid #fbd38d; }
    .btn-icon-edit { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }

    .social-link { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 600; 
      text-decoration: none; 
      padding: 4px; 
      border-radius: 6px; 
      font-size: 10px; 
      width: 100%; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .social-link.url-default { background: #e7f3ff; color: #0066cc; }
    .social-link.url-youtube { background: #ffe6e6; color: #cc0000; }
    .social-link.url-instagram { background: #fdf0f5; color: #c13584; }
    .social-link.url-tiktok { background: #e6f7f7; color: #000000; }
    .social-link.url-facebook { background: #e7f0ff; color: #1877f2; }

    /* Модальні вікна */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 12px; backdrop-filter: blur(2px); }
    .modal-content { background: white; padding: 16px; border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }

    /* Великі зручні кнопки закриття */
    .btn-close-large {
      background: rgba(0,0,0,0.06);
      border: none;
      color: #4a5568;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      min-height: auto;
      padding: 0;
    }
    .btn-close-large:active { background: rgba(0,0,0,0.15); }

    /* Поля зображень */
    .image-fields-list { display: flex; flex-direction: column; gap: 8px; }
    .image-field-item { display: flex; align-items: center; gap: 8px; background: #f8fafc; padding: 6px; border: 1px solid #e2e8f0; border-radius: 8px; }
    .image-field-item img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }

    /* Лайтбокс з гортанням повного зображення */
    .image-viewer-modal { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.92); 
      justify-content: center; 
      align-items: center; 
      z-index: 2000; 
    }
    .viewer-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .viewer-track::-webkit-scrollbar { display: none; }
    .viewer-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-slide img {
      max-width: 95%;
      max-height: 85vh;
      object-fit: contain;
    }
    .viewer-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.25);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 24px;
      z-index: 2100;
      padding: 0;
    }
    .viewer-btn.prev { left: 12px; }
    .viewer-btn.next { right: 12px; }

    /* Велика помітна кнопка закриття у лайтбоксі */
    .close-viewer-btn { 
      position: absolute; 
      top: 16px; 
      right: 16px; 
      color: white; 
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px; 
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer; 
      z-index: 2200; 
    }
    .close-viewer-btn:active { background: rgba(255, 255, 255, 0.4); }

    .floating-add-btn {
      position: fixed; 
      bottom: 20px; 
      left: 16px; 
      z-index: 900; 
      background: #28a745; 
      color: white; 
      border-radius: 30px; 
      padding: 12px 18px; 
      font-size: 14px; 
      font-weight: bold; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.3); 
      width: auto; 
    }

    @media (min-width: 768px) {
      body { max-width: 1400px; margin: 0 auto; padding: 24px; }
      .controls { flex-direction: row; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) !important; gap: 16px; }
      .floating-add-btn { bottom: 30px; left: 30px; }
    }
  </style>
</head>
<body>

<header>
  <h2>📖 Книга Рецептів</h2>
  <button class="menu-toggle-btn" onclick="toggleMenu(event)">☰</button>
  
  <div id="dropdownMenu" class="dropdown-menu">
    <button class="btn-secondary" onclick="exportData(); closeMenu();">💾 Експорт JSON</button>
    <button class="btn-secondary" onclick="document.getElementById('fileInput').click(); closeMenu();">📂 Імпорт JSON</button>
    <button class="btn-excel" onclick="exportExcelData(); closeMenu();">💾 Експорт Excel</button>
    <button class="btn-excel" onclick="document.getElementById('excelInput').click(); closeMenu();">📂 Імпорт Excel</button>
  </div>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Пошук..." oninput="render()">
  <select id="categoryFilter" onchange="render()">
    <option value="">Усі категорії</option>
  </select>

  <div class="grid-control-box">
    <span>📱 Плиток в ряд:</span>
    <select id="colsSelect" onchange="changeGridColumns(this.value)">
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
  </div>

  <input type="file" id="fileInput" accept=".json,application/json" style="display:none" onchange="importData(event)">
  <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="importExcelData(event)">
</div>

<div id="recipesGrid" class="grid"></div>

<button class="floating-add-btn" onclick="openAddModal()">➕ Додати рецепт</button>

<!-- Модальне вікно додавання -->
<div id="addModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>➕ Новий рецепт</h3>
      <button type="button" class="btn-close-large" onclick="closeModal('addModal')">✕</button>
    </div>
    <form id="recipeForm" onsubmit="addRecipe(event)" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="title" placeholder="Назва рецепту *" required>
      <input type="text" id="category" placeholder="Категорія">
      
      <label style="font-size:12px; font-weight:bold; color:#555;">Картинки:</label>
      <div id="addImagesContainer" class="image-fields-list"></div>
      <button type="button" class="btn-secondary" style="font-size:12px; min-height:32px;" onclick="addImageField('add')">📷 Додати картинку</button>

      <input type="text" id="link" placeholder="🔗 Посилання на джерело">
      <textarea id="content" placeholder="📝 Текст рецепту" rows="3"></textarea>
      <textarea id="description" placeholder="📌 Нотатки" rows="2"></textarea>
      
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button type="submit" style="flex:1;">Зберегти</button>
        <button type="button" class="btn-danger" style="flex:1;" onclick="closeModal('addModal')">Скасувати</button>
      </div>
    </form>
  </div>
</div>

<!-- Модальне вікно редагування -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>✏️ Редагувати рецепт</h3>
      <div style="display:flex; gap:8px; align-items:center;">
        <button type="button" class="btn-icon-danger" onclick="deleteCurrentRecipe()">🗑️</button>
        <button type="button" class="btn-close-large" onclick="closeModal('editModal')">✕</button>
      </div>
    </div>
    <form id="editForm" onsubmit="saveEdit(event)" style="display:flex; flex-direction:column; gap:8px;">
      <input type="hidden" id="editId">
      <input type="text" id="editTitle" placeholder="Назва *" required>
      <input type="text" id="editCategory" placeholder="Категорія">
      
      <label style="font-size:12px; font-weight:bold; color:#555;">Картинки:</label>
      <div id="editImagesContainer" class="image-fields-list"></div>
      <button type="button" class="btn-secondary" style="font-size:12px; min-height:32px;" onclick="addImageField('edit')">📷 Додати картинку</button>

      <input type="text" id="editLink" placeholder="🔗 Посилання">
      <textarea id="editContent" placeholder="📝 Текст" rows="3"></textarea>
      <textarea id="editDescription" placeholder="📌 Нотатки" rows="2"></textarea>
      
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button type="submit" style="flex:1;">Зберегти</button>
        <button type="button" class="btn-danger" style="flex:1;" onclick="closeModal('editModal')">Скасувати</button>
      </div>
    </form>
  </div>
</div>

<!-- Модальне вікно опису/нотаток -->
<div id="descModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="descModalTitle"></h3>
      <button type="button" class="btn-close-large" onclick="closeModal('descModal')">✕</button>
    </div>
    <div id="descModalBody" style="display:flex; flex-direction:column; gap:10px; font-size:13px; white-space:pre-wrap; max-height:60vh; overflow-y:auto; background:#f8fafc; padding:10px; border-radius:8px;"></div>
    <button type="button" class="btn-secondary" onclick="closeModal('descModal')">Закрити</button>
  </div>
</div>

<!-- Модальне вікно перегляду та гортання фото -->
<div id="imageViewer" class="image-viewer-modal" onclick="closeViewerOnBackground(event)">
  <button class="close-viewer-btn" onclick="closeModal('imageViewer')">✕</button>
  <div class="viewer-container">
    <button class="viewer-btn prev" onclick="scrollViewer(-1)">‹</button>
    <div id="viewerTrack" class="viewer-track"></div>
    <button class="viewer-btn next" onclick="scrollViewer(1)">›</button>
  </div>
</div>

<script>
  let recipes = JSON.parse(localStorage.getItem('my_recipes')) || [];

  recipes = recipes.map(r => {
    let imgs = r.images || [];
    if (imgs.length === 0 && r.image) imgs = [r.image];
    return { ...r, images: imgs };
  });

  let tempAddImages = [];
  let tempEditImages = [];
  let activeModalId = null;

  /* РОБОТА З ІСТОРІЄЮ ТА КНОПКОЮ "НАЗАД" СМАРТФОНА */
  window.addEventListener('popstate', function(event) {
    if (activeModalId) {
      closeModal(activeModalId, true);
    }
  });

  function openModal(modalId) {
    const modal = document.getElementById(modalId);
    if (!modal) return;
    
    // Якщо якесь вікно вже було відкрите
    if (activeModalId && activeModalId !== modalId) {
      document.getElementById(activeModalId).style.display = 'none';
    }

    modal.style.display = 'flex';
    activeModalId = modalId;

    // Додаємо запис в історію пристрою для перехоплення кнопки "Назад"
    history.pushState({ modalOpen: true, modalId: modalId }, '');
  }

  function closeModal(modalId, isPopState = false) {
    const modal = document.getElementById(modalId);
    if (modal) modal.style.display = 'none';

    if (activeModalId === modalId) {
      activeModalId = null;
    }

    // Якщо закрили кліком (не через кнопка "Назад"), відкочуємо історію назад
    if (!isPopState && history.state && history.state.modalOpen) {
      history.back();
    }
  }

  function closeViewerOnBackground(e) {
    if (e.target.id === 'imageViewer' || e.target.classList.contains('viewer-slide')) {
      closeModal('imageViewer');
    }
  }

  function toggleMenu(e) { e.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('show'); }
  function closeMenu() { document.getElementById('dropdownMenu').classList.remove('show'); }
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('dropdownMenu');
    if (menu.classList.contains('show') && !menu.contains(e.target)) closeMenu();
  });

  function changeGridColumns(cols) {
    const root = document.documentElement;
    root.style.setProperty('--cols-count', cols);
    if (cols >= 4) {
      root.style.setProperty('--card-title-size', '11px');
    } else if (cols == 3) {
      root.style.setProperty('--card-title-size', '12px');
    } else if (cols == 2) {
      root.style.setProperty('--card-title-size', '13px');
    } else {
      root.style.setProperty('--card-title-size', '15px');
    }
    localStorage.setItem('grid_cols', cols);
  }
  const savedCols = localStorage.getItem('grid_cols') || '2';
  document.getElementById('colsSelect').value = savedCols;
  changeGridColumns(savedCols);

  function getLinkInfo(urlStr) {
    if (!urlStr) return null;
    try {
      const host = new URL(urlStr).hostname.toLowerCase();
      if (host.includes('youtube.com') || host.includes('youtu.be')) return { label: 'YouTube', class: 'url-youtube' };
      if (host.includes('instagram.com')) return { label: 'Instagram', class: 'url-instagram' };
      if (host.includes('tiktok.com')) return { label: 'TikTok', class: 'url-tiktok' };
      if (host.includes('facebook.com')) return { label: 'Facebook', class: 'url-facebook' };
      return { label: 'Джерело', class: 'url-default' };
    } catch (e) {
      return { label: 'Джерело', class: 'url-default' };
    }
  }

  function renderImageFields(mode) {
    const container = document.getElementById(mode === 'add' ? 'addImagesContainer' : 'editImagesContainer');
    const imgs = mode === 'add' ? tempAddImages : tempEditImages;
    container.innerHTML = '';

    imgs.forEach((imgBase64, index) => {
      const item = document.createElement('div');
      item.className = 'image-field-item';
      item.innerHTML = `
        <img src="${imgBase64}">
        <input type="file" id="${mode}_file_${index}" accept="image/*" style="display:none" onchange="handleImageReplace(event, '${mode}', ${index})">
        <button type="button" class="btn-secondary" style="font-size:11px; padding:4px 8px; min-height:30px;" onclick="document.getElementById('${mode}_file_${index}').click()">Замінити</button>
        <button type="button" class="btn-danger" style="font-size:11px; padding:4px 8px; min-height:30px;" onclick="removeImageField('${mode}', ${index})">Видалити</button>
      `;
      container.appendChild(item);
    });
  }

  function addImageField(mode) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        processImageFile(file, (base64) => {
          if (mode === 'add') tempAddImages.push(base64);
          else tempEditImages.push(base64);
          renderImageFields(mode);
        });
      }
    };
    input.click();
  }

  function handleImageReplace(e, mode, index) {
    const file = e.target.files[0];
    if (file) {
      processImageFile(file, (base64) => {
        if (mode === 'add') tempAddImages[index] = base64;
        else tempEditImages[index] = base64;
        renderImageFields(mode);
      });
    }
  }

  function removeImageField(mode, index) {
    if (mode === 'add') tempAddImages.splice(index, 1);
    else tempEditImages.splice(index, 1);
    renderImageFields(mode);
  }

  function processImageFile(file, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1000;
        const scale = MAX_WIDTH / img.width;
        canvas.width = img.width > MAX_WIDTH ? MAX_WIDTH : img.width;
        canvas.height = img.width > MAX_WIDTH ? img.height * scale : img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function scrollSlider(trackId, direction) {
    const track = document.getElementById(trackId);
    track.scrollBy({ left: direction * track.clientWidth, behavior: 'smooth' });
  }

  function openDescModal(id, type) {
    const r = recipes.find(item => item.id === id);
    if (!r) return;
    document.getElementById('descModalTitle').innerText = r.title;
    let html = '';
    
    if (type === 'content' && r.content) {
      html = `<div><b>📝 Опис:</b>\n\n${r.content}</div>`;
    } else if (type === 'notes' && r.description) {
      html = `<div style="color:#744210; background:#fffbea; padding:10px; border-radius:6px; border:1px dashed #fbd38d;"><b>📌 Нотатки:</b>\n\n${r.description}</div>`;
    }
    
    document.getElementById('descModalBody').innerHTML = html;
    openModal('descModal');
  }

  function openImageViewer(id, initialIndex) {
    const r = recipes.find(item => item.id === id);
    if (!r) return;
    const imgs = r.images && r.images.length ? r.images : (r.image ? [r.image] : []);
    if (!imgs.length) return;

    const track = document.getElementById('viewerTrack');
    track.innerHTML = imgs.map(src => `
      <div class="viewer-slide">
        <img src="${src}">
      </div>
    `).join('');

    openModal('imageViewer');

    setTimeout(() => {
      track.scrollLeft = initialIndex * track.clientWidth;
    }, 50);
  }

  function scrollViewer(direction) {
    const track = document.getElementById('viewerTrack');
    track.scrollBy({ left: direction * track.clientWidth, behavior: 'smooth' });
  }

  function openAddModal() {
    document.getElementById('recipeForm').reset();
    tempAddImages = [];
    renderImageFields('add');
    openModal('addModal');
  }

  function addRecipe(e) {
    e.preventDefault();
    let rawLink = document.getElementById('link').value.trim();
    if (rawLink && !/^https?:\/\//i.test(rawLink)) rawLink = 'https://' + rawLink;

    recipes.push({
      id: Date.now().toString(),
      title: document.getElementById('title').value,
      category: document.getElementById('category').value.trim() || 'Загальні',
      images: [...tempAddImages],
      image: tempAddImages[0] || "",
      link: rawLink,
      content: document.getElementById('content').value,
      description: document.getElementById('description').value
    });
    saveToStorage();
    closeModal('addModal');
  }

  function openEditModal(id) {
    const r = recipes.find(item => item.id === id);
    if (!r) return;
    document.getElementById('editId').value = r.id;
    document.getElementById('editTitle').value = r.title;
    document.getElementById('editCategory').value = r.category;
    document.getElementById('editLink').value = r.link || '';
    document.getElementById('editContent').value = r.content || '';
    document.getElementById('editDescription').value = r.description || '';
    
    tempEditImages = r.images && r.images.length ? [...r.images] : (r.image ? [r.image] : []);
    renderImageFields('edit');
    openModal('editModal');
  }

  function saveEdit(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const idx = recipes.findIndex(r => r.id === id);
    if (idx !== -1) {
      let rawLink = document.getElementById('editLink').value.trim();
      if (rawLink && !/^https?:\/\//i.test(rawLink)) rawLink = 'https://' + rawLink;

      recipes[idx] = {
        id,
        title: document.getElementById('editTitle').value,
        category: document.getElementById('editCategory').value.trim() || 'Загальні',
        images: [...tempEditImages],
        image: tempEditImages[0] || "",
        link: rawLink,
        content: document.getElementById('editContent').value,
        description: document.getElementById('editDescription').value
      };
      saveToStorage();
      closeModal('editModal');
    }
  }

  function deleteCurrentRecipe() {
    const id = document.getElementById('editId').value;
    if (confirm("Видалити цей рецепт?")) {
      recipes = recipes.filter(r => r.id !== id);
      saveToStorage();
      closeModal('editModal');
    }
  }

  function saveToStorage() {
    localStorage.setItem('my_recipes', JSON.stringify(recipes));
    updateCategories();
    render();
  }

  function updateCategories() {
    const categories = [...new Set(recipes.map(r => r.category))];
    const select = document.getElementById('categoryFilter');
    const val = select.value;
    select.innerHTML = '<option value="">Усі категорії</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
    select.value = val;
  }

  function render() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const grid = document.getElementById('recipesGrid');
    grid.innerHTML = '';

    const filtered = recipes.filter(r => {
      const matchCat = !category || r.category === category;
      const matchSearch = r.title.toLowerCase().includes(search) || 
                          (r.content && r.content.toLowerCase().includes(search)) ||
                          (r.description && r.description.toLowerCase().includes(search));
      return matchCat && matchSearch;
    });

    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';

      const imgs = r.images && r.images.length ? r.images : (r.image ? [r.image] : []);
      let sliderHtml = '';
      
      if (imgs.length > 0) {
        const trackId = `track_${r.id}`;
        const slides = imgs.map((imgSrc, idx) => `
          <img src="${imgSrc}" class="slider-slide" loading="lazy" onclick="openImageViewer('${r.id}', ${idx})">
        `).join('');

        const navBtns = imgs.length > 1 
          ? `<button class="slider-btn prev" onclick="scrollSlider('${trackId}', -1)">‹</button>
             <button class="slider-btn next" onclick="scrollSlider('${trackId}', 1)">›</button>` 
          : '';
        
        sliderHtml = `
          <div class="slider-container">
            ${navBtns}
            <div id="${trackId}" class="slider-track">${slides}</div>
          </div>`;
      } else {
        sliderHtml = `<div class="slider-container"><div class="no-img-placeholder">🍳</div></div>`;
      }

      let linkHtml = '';
      if (r.link) {
        const info = getLinkInfo(r.link);
        if (info) linkHtml = `<a href="${r.link}" target="_blank" class="social-link ${info.class}">${info.label}</a>`;
      }

      let descBtnHtml = r.content ? `<button class="btn-icon-only btn-icon-desc" onclick="openDescModal('${r.id}', 'content')">📝</button>` : '';
      let notesBtnHtml = r.description ? `<button class="btn-icon-only btn-icon-notes" onclick="openDescModal('${r.id}', 'notes')">📌</button>` : '';

      card.innerHTML = `
        <div class="card-header-box">
          <h3>${r.title}</h3>
          <span class="badge">${r.category}</span>
        </div>
        ${sliderHtml}
        <div class="card-footer-box">
          ${linkHtml}
          <div class="card-buttons-row">
            ${descBtnHtml}
            ${notesBtnHtml}
            <button class="btn-icon-only btn-icon-edit" onclick="openEditModal('${r.id}')">✏️</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function exportData() {
    if (!recipes.length) return alert('Немає рецептів!');
    const dataUri = "data:application/json;base64," + btoa(unescape(encodeURIComponent(JSON.stringify(recipes, null, 2))));
    const a = document.createElement('a');
    a.href = dataUri;
    a.download = `recipes_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function exportExcelData() {
    if (!recipes.length) return alert('Немає рецептів!');
    const excelRows = recipes.map(r => ({
      ID: r.id, 
      Назва: r.title, 
      Категорія: r.category, 
      Посилання: r.link || '', 
      Текст_Рецепту: r.content || '', 
      Нотатки: r.description || ''
    }));
    const worksheet = XLSX.utils.json_to_sheet(excelRows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Рецепти");
    const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'base64' });
    const a = document.createElement('a');
    a.href = "data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64," + wbout;
    a.download = `recipes_backup_${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click();
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        let imported = JSON.parse(evt.target.result);
        if (!Array.isArray(imported)) imported = [imported];
        
        imported.forEach(item => {
          const title = item.title || item.name || item.Title || '';
          if (title) {
            let imgs = item.images || [];
            if (!imgs.length && (item.image || item.img)) imgs = [item.image || item.img];
            recipes.push({
              id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
              title: title.toString().trim(),
              category: (item.category || item.Category || 'Загальні').toString().trim(),
              images: imgs,
              image: imgs[0] || '',
              link: (item.link || item.url || '').toString().trim(),
              content: (item.content || item.text || '').toString().trim(),
              description: (item.description || item.notes || '').toString().trim()
            });
          }
        });
        saveToStorage();
        alert('Імпорт завершено!');
      } catch (err) { alert('Помилка JSON файлу'); }
      e.target.value = '';
    };
    reader.readAsText(file, "UTF-8");
  }

  function importExcelData(e) {
    const file = e.target.files[0];
    if (!file || typeof XLSX === 'undefined') return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const excelRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });

        excelRows.forEach(row => {
          const getVal = (keys) => {
            for (let k of keys) {
              const found = Object.keys(row).find(rk => rk.trim().toLowerCase() === k.toLowerCase());
              if (found && row[found]) return row[found];
            }
            return '';
          };
          const title = getVal(['title', 'назва', 'рецепт']);
          if (title) {
            const singleImg = getVal(['image', 'фото']).toString().trim();
            const imgs = singleImg ? [singleImg] : [];
            recipes.push({
              id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
              title: title.toString().trim(),
              category: getVal(['category', 'категорія']) || 'Загальні',
              images: imgs,
              image: singleImg,
              link: getVal(['link', 'посилання']).toString().trim(),
              content: getVal(['content', 'текст', 'текст_рецепту']).toString().trim(),
              description: getVal(['description', 'нотатки', 'опис']).toString().trim()
            });
          }
        });
        saveToStorage();
        alert('Імпорт Excel завершено!');
      } catch (err) { alert('Помилка імпорту Excel'); }
      e.target.value = '';
    };
    reader.readAsArrayBuffer(file);
  }

  updateCategories();
  render();
</script>
</body>
</html>
