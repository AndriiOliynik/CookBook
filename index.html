<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Книга Рецептів</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    /* Додано відступ зверху, щоб інтерфейс не перекривався годинником Android */
    body { 
      padding: 10px; 
      padding-top: calc(36px + env(safe-area-inset-top)); 
      padding-bottom: 110px; 
      background: #f4f4f9; 
      color: #333; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    /* Шапка з безпечними відступами */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 12px; 
      position: relative; 
      padding-top: 6px;
    }
    header h2 { font-size: 20px; font-weight: 800; }

    /* Меню з 3 лініями */
    .menu-toggle-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 22px;
      cursor: pointer;
      padding: 6px 12px;
      color: #333;
      width: auto;
      min-height: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      border-radius: 10px;
      padding: 8px;
      z-index: 1000;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      border: 1px solid #e2e8f0;
    }
    .dropdown-menu.show { display: flex; }
    .dropdown-menu button {
      font-size: 13px;
      min-height: 38px;
      padding: 6px 12px;
      text-align: left;
      justify-content: flex-start;
      border-radius: 6px;
    }

    .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    input, select, button, textarea { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #40E0D0; }
    
    button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    button:active { opacity: 0.85; }
    button.btn-secondary { background: #007bff; }
    button.btn-excel { background: #1d6f42; }
    
    button.btn-edit { background: #40E0D0; color: #fff; padding: 6px 12px; width: 100%; min-height: 36px; border-radius: 6px; font-size: 13px; }
    button.btn-danger { background: #dc3545; color: #fff; }
    button.btn-icon-danger { background: #fff0f0; color: #dc3545; border: 1px solid #ffcdd2; width: 36px; height: 36px; min-height: 36px; border-radius: 50%; padding: 0; font-size: 16px; cursor: pointer; }

    .grid-control-box { display: flex; align-items: center; gap: 8px; background: #fff; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; }
    .grid-control-box select { width: auto; flex-grow: 1; padding: 4px 8px; font-size: 13px; }

    /* Покращена сітка масштабування */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(var(--cols-count, 2), minmax(0, 1fr)); 
      gap: 10px; 
    }
    
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #edf2f7; width: 100%; }
    
    .card-preview { 
      width: 100%; 
      height: var(--card-img-height, 140px); 
      object-fit: cover; 
      object-position: center; 
      background: #e9ecef; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 24px; 
      color: #6c757d; 
      cursor: pointer; 
    }
    
    .card-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .card h3 { font-size: var(--card-title-size, 14px); font-weight: 700; color: #1a202c; line-height: 1.25; word-break: break-word; }
    
    .badge { display: inline-block; background: #edf2f7; color: #4a5568; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 500; }
    
    .text-content { 
      flex-grow: 1; 
      min-height: 24px; 
      max-height: 160px; 
      overflow-y: auto; 
      white-space: pre-wrap; 
      background: #f8fafc; 
      padding: 6px; 
      border-radius: 6px; 
      font-size: var(--card-text-size, 11px); 
      line-height: 1.3;
      border: 1px solid #e2e8f0; 
    }
    .notes-content { 
      font-size: 10px; 
      color: #744210; 
      background: #fffbea; 
      padding: 5px; 
      border-radius: 6px; 
      border: 1px dashed #fbd38d; 
      max-height: 70px;
      overflow-y: auto;
    }

    .card-actions { display: flex; gap: 4px; margin-top: auto; padding-top: 4px; }

    .social-link { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
      font-weight: 600; 
      text-decoration: none; 
      padding: 5px 6px; 
      border-radius: 6px; 
      font-size: 10px; 
      width: 100%; 
    }
    .social-link.url-default { background: #e7f3ff; color: #0066cc; }
    .social-link.url-youtube { background: #ffe6e6; color: #cc0000; }
    .social-link.url-instagram { background: #fdf0f5; color: #c13584; }
    .social-link.url-tiktok { background: #e6f7f7; color: #000000; }
    .social-link.url-facebook { background: #e7f0ff; color: #1877f2; }

    .drop-zone { border: 1px dashed #007bff; border-radius: 8px; padding: 10px; background: #f0f7ff; text-align: center; cursor: pointer; font-size: 12px; color: #0056b3; }
    .preview-thumbnail { max-height: 80px; max-width: 100%; margin-top: 6px; border-radius: 6px; display: none; object-fit: contain; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 12px; backdrop-filter: blur(2px); }
    .modal-content { background: white; padding: 16px; border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; position: relative; }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .modal-header h3 { font-size: 16px; color: #1a202c; }

    .image-viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; z-index: 2000; padding: 5px; }
    .image-viewer-modal img { max-width: 100%; max-height: 95vh; object-fit: contain; }
    .close-viewer { position: absolute; top: 12px; right: 18px; color: white; font-size: 32px; cursor: pointer; font-weight: bold; }

    /* Кнопка Додати — піднята вище (bottom: 80px), щоб не накладатися на жестову смугу/кнопки Android */
    .floating-add-btn {
      position: fixed; 
      bottom: 80px; 
      left: 16px; 
      z-index: 900; 
      background: #28a745; 
      color: white; 
      border: none; 
      border-radius: 30px; 
      padding: 12px 18px; 
      font-size: 14px; 
      font-weight: bold; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.3); 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      cursor: pointer; 
      width: auto; 
      min-height: auto;
    }
  </style>
</head>
<body>

<header>
  <h2>📖 Книга Рецептів</h2>
  <button class="menu-toggle-btn" onclick="toggleMenu(event)">☰</button>
  
  <div id="dropdownMenu" class="dropdown-menu">
    <button class="btn-secondary" onclick="exportData(); closeMenu();">💾 Експорт JSON</button>
    <button class="btn-secondary" onclick="document.getElementById('fileInput').click(); closeMenu();">📂 Імпорт JSON</button>
    <button class="btn-excel" onclick="exportExcelData(); closeMenu();">💾 Експорт Excel</button>
    <button class="btn-excel" onclick="document.getElementById('excelInput').click(); closeMenu();">📂 Імпорт Excel</button>
  </div>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Пошук..." oninput="render()">
  <select id="categoryFilter" onchange="render()">
    <option value="">Усі категорії</option>
  </select>

  <div class="grid-control-box">
    <span>📱 Рецептів в ряд:</span>
    <select id="colsSelect" onchange="changeGridColumns(this.value)">
      <option value="1">1 картка</option>
      <option value="2" selected>2 картки</option>
      <option value="3">3 картки</option>
      <option value="4">4 картки</option>
    </select>
  </div>

  <input type="file" id="fileInput" accept=".json,application/json" style="display:none" onchange="importData(event)">
  <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="importExcelData(event)">
</div>

<div id="recipesGrid" class="grid"></div>

<button class="floating-add-btn" onclick="openAddModal()">➕ Додати рецепт</button>

<div id="addModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>➕ Додати новий рецепт</h3>
      <button type="button" style="width: auto; min-height: auto; padding: 4px 8px; background: transparent; color: #666; border: none; font-size: 20px;" onclick="closeAddModal()">✕</button>
    </div>
    <form id="recipeForm" onsubmit="addRecipe(event)" style="display: flex; flex-direction: column; gap: 8px;">
      <input type="text" id="title" placeholder="Назва рецепту *" required>
      <input type="text" id="category" placeholder="Категорія">
      <div class="drop-zone" onclick="document.getElementById('imageFile').click()">
        📋 <b>Завантажити скріншот</b>
        <input type="file" id="imageFile" accept="image/*" style="display:none" onchange="handleImageUpload(event, 'add')">
        <img id="addPreviewThumb" class="preview-thumbnail" alt="Прев'ю">
      </div>
      <input type="text" id="link" placeholder="🔗 Посилання">
      <textarea id="content" placeholder="📝 Текст рецепту" rows="3"></textarea>
      <textarea id="description" placeholder="📌 Нотатки" rows="2"></textarea>
      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button type="submit" style="flex: 1;">Зберегти</button>
        <button type="button" class="btn-danger" style="flex: 1;" onclick="closeAddModal()">Скасувати</button>
      </div>
    </form>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>✏️ Редагувати рецепт</h3>
      <button type="button" class="btn-icon-danger" onclick="deleteCurrentRecipe()">🗑️</button>
    </div>
    <form id="editForm" onsubmit="saveEdit(event)" style="display: flex; flex-direction: column; gap: 8px;">
      <input type="hidden" id="editId">
      <input type="text" id="editTitle" placeholder="Назва *" required>
      <input type="text" id="editCategory" placeholder="Категорія">
      <div class="drop-zone" onclick="document.getElementById('editImageFile').click()">
        📋 <b>Замінити скріншот</b>
        <input type="file" id="editImageFile" accept="image/*" style="display:none" onchange="handleImageUpload(event, 'edit')">
        <img id="editPreviewThumb" class="preview-thumbnail" alt="Прев'ю">
      </div>
      <button type="button" style="background:#e2e8f0; color:#4a5568; font-size:12px; padding:6px; min-height:30px;" onclick="removeImage()">🗑️ Видалити фото</button>
      <input type="text" id="editLink" placeholder="🔗 Посилання">
      <textarea id="editContent" placeholder="📝 Текст" rows="3"></textarea>
      <textarea id="editDescription" placeholder="📌 Нотатки" rows="2"></textarea>
      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button type="submit" style="flex: 1;">Зберегти</button>
        <button type="button" class="btn-danger" style="flex: 1;" onclick="closeEditModal()">Скасувати</button>
      </div>
    </form>
  </div>
</div>

<div id="imageViewer" class="image-viewer-modal" onclick="closeImageViewer()">
  <span class="close-viewer">&times;</span>
  <img id="fullImage" src="" alt="Скріншот">
</div>

<script>
  let recipes = JSON.parse(localStorage.getItem('my_recipes')) || [];
  let tempAddBase64 = "";
  let tempEditBase64 = "";
  let isImageRemoved = false;

  function toggleMenu(event) {
    event.stopPropagation();
    document.getElementById('dropdownMenu').classList.toggle('show');
  }

  function closeMenu() {
    document.getElementById('dropdownMenu').classList.remove('show');
  }

  document.addEventListener('click', function(e) {
    const menu = document.getElementById('dropdownMenu');
    if (menu.classList.contains('show') && !menu.contains(e.target)) {
      closeMenu();
    }
  });

  // Точне налаштування пропорцій карток під будь-який екран
  function changeGridColumns(cols) {
    const root = document.documentElement;
    root.style.setProperty('--cols-count', cols);
    
    if (cols >= 4) {
      root.style.setProperty('--card-img-height', '70px');
      root.style.setProperty('--card-title-size', '11px');
      root.style.setProperty('--card-text-size', '9px');
    } else if (cols == 3) {
      root.style.setProperty('--card-img-height', '100px');
      root.style.setProperty('--card-title-size', '12px');
      root.style.setProperty('--card-text-size', '10px');
    } else if (cols == 2) {
      root.style.setProperty('--card-img-height', '140px');
      root.style.setProperty('--card-title-size', '14px');
      root.style.setProperty('--card-text-size', '11px');
    } else {
      root.style.setProperty('--card-img-height', '210px');
      root.style.setProperty('--card-title-size', '16px');
      root.style.setProperty('--card-text-size', '13px');
    }
    localStorage.setItem('grid_cols', cols);
  }

  const savedCols = localStorage.getItem('grid_cols') || '2';
  document.getElementById('colsSelect').value = savedCols;
  changeGridColumns(savedCols);

  function getLinkInfo(urlStr) {
    if (!urlStr) return null;
    try {
      const url = new URL(urlStr);
      const host = url.hostname.toLowerCase();
      if (host.includes('youtube.com') || host.includes('youtu.be')) return { label: 'YouTube', class: 'url-youtube' };
      if (host.includes('instagram.com')) return { label: 'Instagram', class: 'url-instagram' };
      if (host.includes('tiktok.com')) return { label: 'TikTok', class: 'url-tiktok' };
      if (host.includes('facebook.com')) return { label: 'Facebook', class: 'url-facebook' };
      return { label: 'Посилання', class: 'url-default' };
    } catch (e) {
      return { label: 'Посилання', class: 'url-default' };
    }
  }

  function generateCustomId() {
    return Date.now().toString();
  }

  function saveToStorage() {
    localStorage.setItem('my_recipes', JSON.stringify(recipes));
    updateCategories();
    render();
  }

  function handleImageUpload(event, mode) {
    const file = event.target.files[0];
    if (file) processImageFile(file, mode);
  }

  function processImageFile(file, mode) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1000;
        const scaleSize = MAX_WIDTH / img.width;
        
        if (img.width > MAX_WIDTH) {
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
        } else {
          canvas.width = img.width;
          canvas.height = img.height;
        }

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

        if (mode === 'add') {
          tempAddBase64 = compressedBase64;
          const thumb = document.getElementById('addPreviewThumb');
          thumb.src = compressedBase64;
          thumb.style.display = 'block';
        } else {
          tempEditBase64 = compressedBase64;
          isImageRemoved = false;
          const thumb = document.getElementById('editPreviewThumb');
          thumb.src = compressedBase64;
          thumb.style.display = 'block';
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removeImage() {
    tempEditBase64 = "";
    document.getElementById('editImageFile').value = "";
    document.getElementById('editPreviewThumb').style.display = "none";
    isImageRemoved = true;
  }

  function openImageViewer(imgSrc) {
    document.getElementById('fullImage').src = imgSrc;
    document.getElementById('imageViewer').style.display = 'flex';
  }

  function closeImageViewer() {
    document.getElementById('imageViewer').style.display = 'none';
  }

  function openAddModal() {
    document.getElementById('recipeForm').reset();
    document.getElementById('addPreviewThumb').style.display = 'none';
    tempAddBase64 = "";
    document.getElementById('addModal').style.display = 'flex';
  }

  function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
    tempAddBase64 = "";
  }

  function addRecipe(e) {
    e.preventDefault();
    let rawLink = document.getElementById('link').value.trim();
    if (rawLink && !/^https?:\/\//i.test(rawLink)) rawLink = 'https://' + rawLink;

    const newRecipe = {
      id: generateCustomId(),
      title: document.getElementById('title').value,
      category: document.getElementById('category').value.trim() || 'Загальні',
      image: tempAddBase64,
      link: rawLink,
      content: document.getElementById('content').value,
      description: document.getElementById('description').value
    };
    
    recipes.push(newRecipe);
    saveToStorage();
    closeAddModal();
  }

  function openEditModal(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;

    tempEditBase64 = "";
    isImageRemoved = false;
    
    document.getElementById('editId').value = recipe.id;
    document.getElementById('editTitle').value = recipe.title;
    document.getElementById('editCategory').value = recipe.category;
    document.getElementById('editLink').value = recipe.link || '';
    document.getElementById('editContent').value = recipe.content || '';
    document.getElementById('editDescription').value = recipe.description || '';

    const editThumb = document.getElementById('editPreviewThumb');
    if (recipe.image) {
      editThumb.src = recipe.image;
      editThumb.style.display = 'block';
    } else {
      editThumb.style.display = 'none';
    }

    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    tempEditBase64 = "";
    isImageRemoved = false;
  }

  function saveEdit(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const recipeIndex = recipes.findIndex(r => r.id === id);

    if (recipeIndex !== -1) {
      let finalImage = "";
      if (!isImageRemoved) {
        finalImage = tempEditBase64 || recipes[recipeIndex].image || "";
      }

      let rawLink = document.getElementById('editLink').value.trim();
      if (rawLink && !/^https?:\/\//i.test(rawLink)) rawLink = 'https://' + rawLink;

      recipes[recipeIndex] = {
        id: id,
        title: document.getElementById('editTitle').value,
        category: document.getElementById('editCategory').value.trim() || 'Загальні',
        image: finalImage,
        link: rawLink,
        content: document.getElementById('editContent').value,
        description: document.getElementById('editDescription').value
      };
      
      saveToStorage();
      closeEditModal();
    }
  }

  function deleteCurrentRecipe() {
    const id = document.getElementById('editId').value;
    if (confirm(`Видалити цей рецепт?`)) {
      recipes = recipes.filter(r => r.id !== id);
      saveToStorage();
      closeEditModal();
    }
  }

  function updateCategories() {
    const categories = [...new Set(recipes.map(r => r.category))];
    const select = document.getElementById('categoryFilter');
    const currentValue = select.value;
    select.innerHTML = '<option value="">Усі категорії</option>' + 
      categories.map(c => `<option value="${c}">${c}</option>`).join('');
    select.value = currentValue;
  }

  function render() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const grid = document.getElementById('recipesGrid');
    grid.innerHTML = '';

    const filtered = recipes.filter(r => {
      const matchesCategory = !category || r.category === category;
      const matchesSearch = r.title.toLowerCase().includes(search) || 
                            (r.content && r.content.toLowerCase().includes(search)) ||
                            (r.description && r.description.toLowerCase().includes(search));
      return matchesCategory && matchesSearch;
    });

    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      
      let previewHtml = r.image 
        ? `<img src="${r.image}" class="card-preview" alt="${r.title}" loading="lazy" onclick="openImageViewer('${r.image}')">`
        : `<div class="card-preview">🍳</div>`;

      let actionButtonsHtml = '';
      if (r.link) {
        const linkInfo = getLinkInfo(r.link);
        if (linkInfo) {
          actionButtonsHtml += `<a href="${r.link}" target="_blank" class="social-link ${linkInfo.class}">${linkInfo.label}</a>`;
        }
      }

      let contentHtml = r.content ? `<div class="text-content">${r.content}</div>` : '';
      let notesHtml = r.description ? `<div class="notes-content">📎 ${r.description}</div>` : '';

      card.innerHTML = `
        ${previewHtml}
        <div class="card-body">
          <h3>${r.title}</h3>
          <div><span class="badge">${r.category}</span></div>
          ${actionButtonsHtml}
          ${contentHtml}
          ${notesHtml}
          <div class="card-actions">
            <button class="btn-edit" onclick="openEditModal('${r.id}')">✏️ Редагувати</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Експорт JSON, оптимізований для Android 13-16 / POCO
  function exportData() {
    if (recipes.length === 0) {
      alert('Немає рецептів для експорту!');
      return;
    }
    const jsonString = JSON.stringify(recipes, null, 2);
    const dataUri = "data:application/json;base64," + btoa(unescape(encodeURIComponent(jsonString)));
    
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataUri);
    downloadAnchor.setAttribute("download", `recipes_backup_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  // Експорт Excel
  function exportExcelData() {
    if (recipes.length === 0) { 
      alert('Немає рецептів для експорту!'); 
      return; 
    }
    const excelRows = recipes.map(r => ({
      ID: r.id, 
      Назва: r.title, 
      Категорія: r.category, 
      Посилання: r.link || '', 
      Текст_Рецепту: r.content || '', 
      Нотатки: r.description || ''
    }));

    try {
      const worksheet = XLSX.utils.json_to_sheet(excelRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Рецепти");
      
      const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'base64' });
      const dataUri = "data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64," + wbout;
      
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataUri);
      downloadAnchor.setAttribute("download", `recipes_backup_${new Date().toISOString().slice(0,10)}.xlsx`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    } catch (err) { 
      alert('Помилка експорту Excel: ' + err.message); 
    }
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;

    let replaceData = false;
    if (recipes.length > 0) {
      replaceData = confirm("Замінити існуючі рецепти?\n\n[OK] — Замінити всі\n[Скасувати] — Додати до існуючих");
    }

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        let textData = evt.target.result;
        let imported = JSON.parse(textData);
        
        if (!Array.isArray(imported)) {
          if (typeof imported === 'object' && imported !== null) imported = [imported];
          else { alert('Невірний формат JSON'); return; }
        }

        if (replaceData) recipes = [];

        let count = 0;
        imported.forEach(item => {
          const title = item.title || item.name || item.Title || '';
          if (title) {
            recipes.push({
              id: generateCustomId() + Math.random().toString(36).substr(2, 4),
              title: title.toString().trim(),
              category: (item.category || item.Category || 'Загальні').toString().trim(),
              image: (item.image || item.img || '').toString().trim(),
              link: (item.link || item.url || '').toString().trim(),
              content: (item.content || item.text || '').toString().trim(),
              description: (item.description || item.notes || '').toString().trim()
            });
            count++;
          }
        });

        if (count > 0) { 
          saveToStorage(); 
          alert(`Успішно імпортовано ${count} рецептів!`); 
        } else {
          alert('Не знайдено рецептів для імпорту.');
        }
      } catch (err) { 
        alert('Помилка читання JSON файлу: ' + err.message); 
      }
      e.target.value = '';
    };

    reader.onerror = function() {
      alert("Не вдалося прочитати файл з пам'яті пристрою.");
    };

    reader.readAsText(file, "UTF-8");
  }

  function importExcelData(e) {
    const file = e.target.files[0];
    if (!file || typeof XLSX === 'undefined') return;

    let replaceData = false;
    if (recipes.length > 0) {
      replaceData = confirm("Замінити існуючі рецепти?\n\n[OK] — Замінити всі\n[Скасувати] — Додати до існуючих");
    }

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const excelRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        if (replaceData) recipes = [];

        let count = 0;
        excelRows.forEach(row => {
          const getVal = (keys) => {
            for (let key of keys) {
              const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === key.toLowerCase());
              if (foundKey && row[foundKey] !== undefined) return row[foundKey];
            }
            return '';
          };

          const title = getVal(['title', 'назва', 'рецепт']);
          if (title) {
            recipes.push({
              id: generateCustomId() + Math.random().toString(36).substr(2, 4),
              title: title.toString().trim(),
              category: getVal(['category', 'категорія']) || 'Загальні',
              image: getVal(['image', 'фото', 'image_base64']).toString().trim(),
              link: getVal(['link', 'посилання']).toString().trim(),
              content: getVal(['content', 'текст', 'текст_рецепту']).toString().trim(),
              description: getVal(['description', 'нотатки', 'опис']).toString().trim()
            });
            count++;
          }
        });

        if (count > 0) { saveToStorage(); alert(`Імпортовано ${count} рецептів!`); }
      } catch (err) { alert('Помилка імпорту Excel.'); }
      e.target.value = '';
    };
    reader.readAsArrayBuffer(file);
  }

  updateCategories();
  render();
</script>
